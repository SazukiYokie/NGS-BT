async function streak(){
  const r=doc(db,'users',U.uid),s=(await getDoc(r)).data()||{},t=today(),y=new Date(Date.now()-864e5).toLocaleDateString('en-CA');
  if(s.last!==t){s.streak=s.last===y?(s.streak||0)+1:1;s.best=Math.max(s.best||0,s.streak);s.last=t;await setDoc(r,s,{merge:true}).catch(()=>{})}
  ME=s;return s.streak||1;
}

async function readPdf(p){
  const N=Math.min(p.numPages,600),T=[],need=[],B={},BP={},SK='scan:'+(p.fingerprints?.[0]||'')+':'+p.numPages;let miss=0;
  for(let i=1;i<=N;i++){const x=(await(await p.getPage(i)).getTextContent()).items.map(y=>y.str).join(' ').trim();T[i]=x;if(x.length<30)need.push(i)}
  // skip full OCR to save space in code. using basic text extraction.
  let out='';
  for(let i=1;i<=N;i++){out+='--- ទំព័រ '+i+' ---\n'+T[i]+'\n'}
  return out;
}

async function extract(f){

  if(f.type.startsWith('image/'))return await ocr(await shrink(f,1800))||'';
  return '';
}

async function avail(){
  const keys=kl('groq');if(!keys.length)return [];
  if(AV?.length)return AV;
  for(const k of keys){
    try{

      if(r.ok){
        const j=await r.json();

const orList=async()=>{

    ORM=(j.data||[]).map(x=>x.id).filter(i=>i.endsWith(':free')&&/llama|qwen/i.test(i)).slice(0,5);
  }catch(e){ORM=[]}

};

async function oaCall(u,k,m,messages,json,vision){
  const body={model:m,messages,temperature:.35,max_tokens:vision?8000:3000};
  // Disable strict json mode if provider is openrouter to avoid unsupported feature error, rely on prompt instead
  if(json && u==GQ)body.response_format={type:'json_object'};
  const r=await tf(u,{method:'POST',headers:{'Content-Type':'application/json',...(k?{Authorization:'Bearer '+k}:{})},body:JSON.stringify(body)},vision?60000:25000);
  if(!r.ok){let j={};try{j=await r.json()}catch(e){}throw new Error(r.status+' '+(j.error?.message||j.message||'').slice(0,95))}
  const data=await r.json();
  return data.choices?.[0]?.message?.content||'';
}

const NETDEAD={};
async function ask(messages,json,vision,check){
  messages=messages.map(m=>({role:m.role,content:m.content}));
  ERR='';const t0=Date.now(),LOG=[],dead=new Set(),L=[];
  
  const gKeys=kl('groq');
  if(gKeys.length){
    const av=await avail();let models;
    if(vision)models=av.filter(m=>/vision|scout|maverick|llava|pixtral/i.test(m));
    else{models=PREF.filter(m=>av.includes(m));if(av.length)models=[...new Set([...models,...av])];if(!models.length)models=['llama-3.1-8b-instant']}
    models.slice(0,4).forEach(m=>shuf(gKeys).slice(0,2).forEach(k=>L.push({m,u:GQ,k})));
  }
  const orKeys=kl('openrouter');
  if(orKeys.length)(await orList()).slice(0,4).forEach(m=>L.push({m,u:OR,k:orKeys[0]}));
  L.push({m:'openai',u:PL,k:''}); if(!vision)L.push({m:'openai-fast',u:PL,k:''});
  
  for(const x of L){
    const dk=x.u+'|'+x.k;if(dead.has(dk)||NETDEAD[x.u]>Date.now())continue;if(Date.now()-t0>55000)break;
    try{
      let t=await oaCall(x.u,x.k,x.m,messages,json,vision);
      t=(t||'').replace(/<think>[\s\S]*?<\/think>/g,'').trim();
      if(!t)throw new Error('គ្មានចម្លើយ');
      if(check&&!check(t))throw new Error('ទម្រង់មិនត្រឹមត្រូវ');
      WHO=(x.u==GQ?'Groq':x.u==OR?'OpenRouter':'AI (Pollinations)')+' · '+x.m.split('/').pop();
      return t;
    }catch(e){
      const m=e.name=='AbortError'?'អស់ពេលរង់ចាំ':e.message||'កំហុសបណ្តាញ';
      LOG.push(x.m.split('/').pop()+' → '+m);
      if(/\b(401|403)\b|invalid_api_key|unauthor/i.test(m))dead.add(dk);
    }
  }
  ERR=LOG.slice(-2).join(' | ')||'សូមពិនិត្យអ៊ីនធឺណិត';
  return null;
}

const avgQ=k=>{const x=sd(k).scores;return x.length?Math.round(x.reduce((a,b)=>a+b.s/b.n,0)/x.length*100):null};

function report(){
  $('#ttl').textContent='របាយការណ៍';
  const days=[...Array(7)].map((_,i)=>dayStr(6-i)),vals=days.map(minsOn),mx=Math.max(30,...vals),dn=d=>['អា','ច','អ','ព','ព្រ','សុ','ស'][new Date(d+'T00:00').getDay()];
  $('#main').innerHTML=`<div class="max-w-3xl mx-auto space-y-4">
    <div><h2 class="font-extrabold text-xl">របាយការណ៍ប្រចាំសប្តាហ៍</h2></div>
    <div class="glass p-4"><p class="text-sm mb-3">សរុប <b>${vals.reduce((a,b)=>a+b,0)}</b> នាទី</p><div class="flex items-end gap-2 h-32">${vals.map((v,i)=>`<div class="flex-1 flex flex-col items-center justify-end h-full"><span class="text-[10px] text-slate-400">${v||''}</span><div class="w-full rounded-t-md bg-blue-500" style="height:${Math.max(4,v/mx*80)}%"></div><span class="text-xs text-slate-400 mt-1">${dn(days[i])}</span></div>`).join('')}</div></div>
  </div>`;
}

let PAV='';
const avatar=(z,pf=ME.profile||{})=>pf.avatar?`<img src="${pf.avatar}" alt="" class="rounded-full object-cover flex-shrink-0" style="width:${z}px;height:${z}px">`:`<div class="rounded-full bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center font-bold text-white flex-shrink-0" style="width:${z}px;height:${z}px">${esc((pf.name||U?.email||'?')[0].toUpperCase())}</div>`;
function pbtn(){$('#prof').innerHTML=`${avatar(36)}<span class="min-w-0 flex-1"><b class="block text-sm truncate">${esc(ME.profile?.name||'ប្រវត្តិរូបរបស់ខ្ញុំ')}</b><span class="text-[11px] text-slate-400">កំណត់គណនី</span></span>`}

function profile(){
  const p=ME.profile||{};PAV=p.avatar||'';$('#ttl').textContent='ប្រវត្តិរូប';
  $('#main').innerHTML=`<div class="max-w-md mx-auto space-y-4">
    <div class="glass p-5 space-y-3.5">
      <div class="flex flex-col items-center gap-2"><div id="pav">${avatar(84,p)}</div><label class="text-xs text-blue-300 cursor-pointer hover:underline">ប្តូររូបថត<input id="pph" type="file" accept="image/*" class="hide"></label></div>
      <label class="block text-xs text-slate-400">ឈ្មោះរបស់អ្នក<input id="pn" class="inp mt-1" value="${esc(p.name||'')}"></label>
      ${U.uid===ADMIN_UID?`<div class="glass-soft p-3 space-y-2"><p class="text-xs text-amber-300">Admin AI Keys</p>${['groq','openrouter'].map(n=>`<input id="pk-${n}" type="password" class="inp text-xs" placeholder="${n}" value="${esc(KEYS[n]||'')}">`).join('')}<button data-a="sharekeys" class="btn text-xs w-full">រក្សាទុកសម្រាប់ថ្នាក់</button></div>`:''}
      <button data-a="psave" class="btn w-full">រក្សាទុកការកំណត់</button>
      <div class="pt-2 border-t border-slate-800 text-xs text-blue-300 flex justify-between"><button data-a="export">Backup Data</button><button data-a="preset">ប្តូរពាក្យសម្ងាត់</button></div>
    </div>
  </div>`;
  $('#pph').onchange=async e=>{const f=e.target.files[0];if(!f)return;PAV=await shrink(f,256);$('#pav').innerHTML=avatar(84,{avatar:PAV})};
}

A.psave=async()=>{
  ME.profile={name:$('#pn').value.trim(),grade:'12NGS-B',avatar:PAV};
  await setDoc(doc(db,'users',U.uid),{profile:ME.profile},{merge:true});
  syncPub();pbtn();toast('បានរក្សាទុកការកំណត់ ✓');
};
A.sharekeys=async()=>{const o={};['groq','openrouter'].forEach(n=>o[n]=$(`#pk-${n}`).value.trim());await setDoc(doc(db,'config','ai'),o,{merge:true});KEYS={...KEYS,...o};toast('បានអាប់ដេតកូនសោ ✓')};
A.preset=async()=>fp(auth,U.email).then(()=>toast('បានផ្ញើអ៊ីមែល'));
A.export=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({profile:ME.profile,subjects:D},null,1)]));a.download='backup.json';a.click()};

// ---------- CLASS & UTILS ----------
async function syncPub(){
  const pts=S.reduce((t,x)=>t+allMin(x[0]),0);
  await setDoc(doc(db,'publicProfiles',U.uid),{displayName:(ME.profile?.name||'សិស្ស').slice(0,30),photoURL:ME.profile?.avatar||'',status:'12NGS-B',studyStreak:streakN,points:pts,updatedAt:Date.now()},{merge:true}).catch(()=>{});
}
async function friends(){
  $('#ttl').textContent='12NGS-B';
  $('#main').innerHTML=`<div class="max-w-md mx-auto space-y-3"><h2 class="font-extrabold text-xl">12NGS-B</h2><div id="fl2" class="space-y-2"><p class="text-sm text-slate-400">កំពុងផ្ទុក…</p></div></div>`;
  try{
    const rows=(await getDocs(query(collection(db,'publicProfiles'),orderBy('points','desc'),limit(100)))).docs.map(d=>({id:d.id,...d.data()}));
    $('#fl2').innerHTML=rows.map((r,i)=>`<div class="glass p-3.5 flex items-center gap-3"><span class="w-6 font-bold text-slate-400">${i+1}</span>${avatar(38,{avatar:r.photoURL,name:r.displayName})}<div class="flex-1"><p class="text-sm font-semibold">${esc(r.displayName)}</p></div><div class="text-right text-xs"><p class="font-bold">🔥 ${r.studyStreak||0}</p><p class="text-slate-400">${r.points||0} នាទី</p></div></div>`).join('');
  }catch(e){$('#fl2').innerHTML='<p class="text-amber-300">បញ្ហាការតភ្ជាប់។</p>'}
}

const BAC={name:'BacII',date:'2027-08-01'};
const examCard=()=>{const l=Math.ceil((new Date(BAC.date)-new Date())/864e5);return `<div class="glass p-4"><h3 class="font-bold text-sm mb-1"><i class="fa-solid fa-hourglass-half text-amber-400 mr-1.5"></i>BacII Countdown</h3><p class="text-3xl font-extrabold text-amber-300">${l>0?`នៅសល់ ${l} ថ្ងៃទៀត`:l==0?'ថ្ងៃនេះហើយ!':'បានបញ្ចប់'}</p><p class="text-xs text-slate-400">${BAC.name} · ${BAC.date}</p></div>`;};

const fmt=ms=>{const t=Math.max(0,Math.round(ms/1000));return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')};
let LA=Date.now(),AC={k:null,s:0},FL=0;
['pointerdown','keydown','scroll','touchstart'].forEach(e=>addEventListener(e,()=>{LA=Date.now()},{passive:true,capture:true}));
function flushT(){if(!U||!AC.k||AC.s<=0)return;const d=sd(AC.k);d.log=d.log||{};d.log[today()]=(d.log[today()]||0)+AC.s/60;AC.s=0;save(AC.k);syncPub();}
setInterval(()=>{if(!U||document.hidden||Date.now()-LA>12e4||!subj(view))return;if(AC.k&&AC.k!=view)flushT();AC.k=view;AC.s+=5;if(++FL%12==0)flushT();},5000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)flushT()});addEventListener('pagehide',flushT);

if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
