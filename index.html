<style>
html,body{height:100%;height:100dvh;margin:0;background:#050814;color:#f8fafc;overflow-x:hidden}
.hide{display:none!important}
.orb{position:fixed;border-radius:9999px;filter:blur(85px);opacity:.3;pointer-events:none;z-index:0;animation:fl 12s infinite ease-in-out alternate}
@keyframes fl{to{transform:translate(40px,-30px) scale(1.15)}}
.glass{background:rgba(15,23,42,.76);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(148,163,184,.16)}
.btn{background:linear-gradient(90deg,#2563eb,#4f46e5);color:#fff;font-weight:600;padding:.6rem 1rem;border-radius:.75rem;font-size:.85rem}
.btn:disabled{opacity:.5}
.inp{width:100%;min-width:0;background:rgba(2,6,23,.6);border:1px solid rgba(148,163,184,.25);border-radius:.75rem;padding:.6rem .8rem;font-size:.9rem;color:#f8fafc}
.inp option{background:#0f172a}
.tab{padding:.5rem .9rem;border-radius:.75rem;font-size:.8rem;font-weight:600;white-space:nowrap;color:#cbd5e1}
.tab.on{background:var(--c);color:#fff}
.katex-display{overflow-x:auto;overflow-y:hidden}.md p{margin:.4rem 0}.md ul{list-style:disc;padding-left:1.2rem}.md ol{list-style:decimal;padding-left:1.2rem}
.md code{background:#0008;padding:0 .25rem;border-radius:.25rem}.md pre{background:#0008;padding:.6rem;border-radius:.5rem;overflow-x:auto}
html{font-size:15px}
.noscroll{scrollbar-width:none}.noscroll::-webkit-scrollbar{display:none}
.text-slate-400{color:#b4bfd0!important}.text-slate-500{color:#98a4b8!important}
.text-\[11px\]{font-size:12px!important}.text-\[9px\]{font-size:10.5px!important}
.glass{border-radius:1.1rem}
.inp{font-size:.92rem;padding:.6rem .8rem;border-radius:.85rem}
.btn{min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:.25rem}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:.45rem}
@media(min-width:768px){.tabs{grid-template-columns:repeat(7,1fr)}}
.tab{display:flex;flex-direction:column;align-items:center;gap:.1rem;padding:.55rem .15rem;border-radius:.85rem;background:rgba(30,41,59,.6);font-size:.78rem;line-height:1.2;white-space:normal;text-align:center}
.tab i{font-size:1.05rem;margin:0}
.tab.on{background:var(--c);box-shadow:0 8px 20px -8px var(--c)}
.chip{padding:.4rem .8rem;border-radius:999px;background:rgba(51,65,85,.65);font-size:.8rem}
#main{scroll-behavior:smooth}
</style>
</head>
<body class="font-sans">
<div class="orb" style="width:380px;height:380px;background:#3b82f6;top:-80px;left:-80px"></div>
<div class="orb" style="width:400px;height:400px;background:#8b5cf6;bottom:-90px;right:-60px;animation-delay:-4s"></div>

<!-- LOGIN -->
<div id="auth" class="relative z-10 min-h-full flex items-center justify-center p-4">
  <div class="glass rounded-2xl p-6 w-full max-w-sm space-y-3">
    <div class="text-center">
      <div class="w-12 h-12 mx-auto rounded-xl bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center"><i class="fa-solid fa-graduation-cap text-xl"></i></div>
      <h1 class="font-extrabold text-xl mt-2">Study Hub<span class="text-blue-400">.</span></h1>
      <p class="text-xs text-slate-400">My school space · កន្លែងសិក្សារបស់ខ្ញុំ</p>
    </div>
    <input id="em" type="email" class="inp" placeholder="Email" autocomplete="email">
    <input id="pw" type="password" class="inp" placeholder="Password (6+ characters)" autocomplete="current-password">
    <p id="amsg" class="text-xs text-amber-300 hide"></p>
    <button id="bgo" class="btn w-full">Log in</button>
    <p class="text-[11px] text-slate-500 text-center">Share this link with friends. Everyone makes their own account and each person’s data stays private.</p>
    <div class="flex justify-between text-xs text-blue-300"><button id="bmode">Create account</button><button id="bforgot">Forgot password?</button></div>
  </div>
</div>

<!-- APP -->
<div id="app" class="hide relative z-10 h-full flex">
  <div id="ov" class="hide fixed inset-0 bg-black/60 z-30 md:hidden"></div>
  <aside id="side" class="glass fixed md:static z-40 inset-y-0 left-0 w-64 -translate-x-full md:translate-x-0 transition-transform flex flex-col">
    <div class="p-4 font-extrabold border-b border-slate-700/50"><i class="fa-solid fa-graduation-cap text-blue-400 mr-2"></i>Study Hub<span class="text-blue-400">.</span><span class="block text-[11px] font-normal text-slate-400">ថ្នាក់ទី ១២ NGS B</span></div>
    <nav id="nav" class="p-2 space-y-1 overflow-y-auto flex-1"></nav>
    <button id="prof" class="mx-2 mt-2 p-2 rounded-xl flex items-center gap-2.5 text-left hover:bg-slate-800/60"></button>
    <button id="out" class="mx-2 mb-2 p-2.5 rounded-xl text-red-400 text-sm text-left hover:bg-red-500/10"><i class="fa-solid fa-right-from-bracket w-5"></i>ចាកចេញ · Sign out</button>
  </aside>
  <main class="flex-1 min-w-0 flex flex-col h-full">
    <header class="glass md:hidden flex items-center gap-3 p-3"><button id="burger" aria-label="Menu"><i class="fa-solid fa-bars"></i></button><span id="ttl" class="font-bold text-sm">Dashboard</span></header>
    <div id="main" class="flex-1 overflow-y-auto p-4 md:p-6"></div>
  </main>
</div>
<div id="toast" class="hide fixed bottom-5 left-1/2 -translate-x-1/2 z-50 glass rounded-xl px-4 py-2 text-sm"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,signInWithEmailAndPassword as si,createUserWithEmailAndPassword as su,sendPasswordResetEmail as fp,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,doc,setDoc,getDoc,getDocs,deleteDoc,collection,query,orderBy,limit} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyDK4s6dw-Rm_pK1zEABEbSbTz7_5gPk_4k",authDomain:"ngs-bt.firebaseapp.com",projectId:"ngs-bt",storageBucket:"ngs-bt.firebasestorage.app",messagingSenderId:"1087138498515",appId:"1:1087138498515:web:366cf3dbefd2ddbcadd126"};
let KEYS={};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// key, Khmer name, English name, icon, colour
const S=[["math","គណិតវិទ្យា","Math","fa-square-root-variable","#3b82f6"],["chem","គីមីវិទ្យា","Chemistry","fa-flask","#10b981"],["phys","រូបវិទ្យា","Physics","fa-atom","#8b5cf6"],["bio","ជីវវិទ្យា","Biology","fa-dna","#22c55e"],["geo","ភូមិវិទ្យា","Geography","fa-earth-asia","#06b6d4"],["civ","សីលធម៍ពលរដ្ឋ","Civics & Morality","fa-scale-balanced","#f59e0b"],["eng","ភាសាអង់គ្លេស","English","fa-language","#ec4899"],["earth","ផែនដីវិទ្យា","Earth Science","fa-mountain","#f97316"],["khm","ភាសាខ្មែរ","Khmer Language","fa-book-open","#ef4444"],["hist","ប្រវត្តិវិទ្យា","History","fa-landmark","#a78bfa"]];
const T=[["files","ឯកសារ","Files","fa-folder-open"],["notes","កំណត់ត្រា","Notes","fa-note-sticky"],["hw","កិច្ចការផ្ទះ","Homework","fa-list-check"],["ai","គ្រូ AI","AI Tutor","fa-wand-magic-sparkles"],["quiz","សំណួរ","Quiz","fa-circle-question"],["cards","ប័ណ្ណចងចាំ","Cards","fa-clone"],["time","ម៉ោងសិក្សា","Timer","fa-stopwatch"]];

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toLocaleDateString('en-CA');
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.remove('hide');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.add('hide'),2600)};
const subj=k=>S.find(x=>x[0]==k);
let U,D={},view='dash',tab='files',chat={},Q,streakN=1,ME={},TM=null,IMG=null,X=null;
const sd=k=>D[k]||(D[k]={notes:'',hw:[],files:[],scores:[],lang:'km'});
const save=k=>setDoc(doc(db,'users',U.uid,'subjects',k),sd(k)).catch(e=>toast('Save failed: '+e.code));
const txtRef=(k,id)=>doc(db,'users',U.uid,'subjects',k,'texts',id);

// original files stay on this device (free, no Storage plan needed)
const idb=new Promise(r=>{const q=indexedDB.open('studyhub',1);q.onupgradeneeded=()=>q.result.createObjectStore('f');q.onsuccess=()=>r(q.result)});
const idbPut=async(k,v)=>(await idb).transaction('f','readwrite').objectStore('f').put(v,k);
const idbDel=async k=>(await idb).transaction('f','readwrite').objectStore('f').delete(k);
const idbGet=async k=>{const d=await idb;return new Promise(r=>{const q=d.transaction('f').objectStore('f').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()})};

// ---------- AUTH ----------
let mode='in';
const am=t=>{const e=$('#amsg');e.textContent=t;e.classList.remove('hide')};
$('#bmode').onclick=()=>{mode=mode=='in'?'up':'in';$('#bgo').textContent=mode=='in'?'Log in':'Create account';$('#bmode').textContent=mode=='in'?'Create account':'I have an account'};
$('#bgo').onclick=async()=>{try{await (mode=='in'?si:su)(auth,$('#em').value.trim(),$('#pw').value)}catch(e){am((e.code||e.message).replace('auth/','').replace(/-/g,' '))}};
$('#bforgot').onclick=async()=>{try{await fp(auth,$('#em').value.trim());am('Reset email sent. Check your inbox.')}catch(e){am('Type your email first.')}};
$('#out').onclick=()=>signOut(auth);
const side=o=>{$('#side').classList.toggle('-translate-x-full',!o);$('#ov').classList.toggle('hide',!o)};
$('#burger').onclick=()=>side(true);$('#ov').onclick=()=>side(false);

async function streak(){const r=doc(db,'users',U.uid),s=(await getDoc(r)).data()||{},t=today(),y=new Date(Date.now()-864e5).toLocaleDateString('en-CA');
  if(s.last!==t){s.streak=s.last===y?(s.streak||0)+1:1;s.best=Math.max(s.best||0,s.streak);s.last=t;await setDoc(r,s,{merge:true}).catch(()=>{})}
  ME=s;return s.streak||1}

onAuthStateChanged(auth,async u=>{U=u;$('#auth').classList.toggle('hide',!!u);$('#app').classList.toggle('hide',!u);
  if(!u){D={};chat={};if(TM){clearInterval(TM.iv);TM=null}if(X){clearInterval(X.iv);X=null;$('#xo')?.remove()}return}
  try{(await getDocs(collection(db,'users',u.uid,'subjects'))).forEach(d=>D[d.id]={...sd(d.id),...d.data()});streakN=await streak()}catch(e){toast('Could not load your data: '+(e.code||''))}
  try{const c=await getDoc(doc(db,'config','ai'));if(c.exists())KEYS={...c.data()}}catch(e){}pbtn();syncPub();if(ME.profile?.name)go('dash');else{go('profile');toast('Welcome! Set your name and grade first 👋')}});

// ---------- NAV ----------
function nav(){$('#nav').innerHTML=[['dash','ទំព័រដើម','fa-house','#60a5fa'],['allhw','កិច្ចការផ្ទះ','fa-list-check','#fb923c'],['report','របាយការណ៍','fa-chart-simple','#f472b6'],['friends','ថ្នាក់ NGS B','fa-users','#34d399'],...S.map(s=>[s[0],s[1],s[3],s[4]])].map(([k,n,i,c])=>`<button data-k="${k}" class="w-full flex items-center gap-3 p-2.5 rounded-xl text-sm text-slate-300 hover:bg-slate-800/60 text-left ${view==k?'bg-slate-800 font-semibold':''}"><i class="fa-solid ${i} w-5" style="color:${c}"></i>${n}</button>`).join('')}
$('#nav').onclick=e=>{const b=e.target.closest('[data-k]');if(b)go(b.dataset.k)};
function go(k){view=k;tab='files';side(false);nav();render()}

function render(){
  if(view=='dash')return dash();if(view=='profile')return profile();if(view=='report')return report();if(view=='allhw')return allhw();if(view=='friends')return friends();
  const s=subj(view);$('#ttl').textContent=s[1];
  $('#main').innerHTML=`<div class="max-w-3xl mx-auto space-y-4" style="--c:${s[4]}">
  <div class="flex items-center gap-3"><div class="w-11 h-11 rounded-xl flex items-center justify-center" style="background:${s[4]}33;color:${s[4]}"><i class="fa-solid ${s[3]} text-lg"></i></div><div><h2 class="font-extrabold text-xl">${s[1]}</h2></div></div>
  <div class="tabs">${T.map(([k,kh,en,i])=>`<button data-t="${k}" class="tab text-center ${tab==k?'on':''}"><i class="fa-solid ${i}"></i><span class="block leading-tight mt-0.5">${kh}</span></button>`).join('')}</div>
  <div id="pane" class="glass rounded-2xl p-4"></div></div>`;
  pane()}
const pane=()=>({files,notes,hw,ai,quiz,cards,time})[tab]();
const A={};
$('#main').onclick=e=>{const b=e.target.closest('[data-t],[data-a]');if(!b)return;if(b.dataset.t){tab=b.dataset.t;render();return}A[b.dataset.a]?.(b.dataset.v,b)};

// ---------- DASHBOARD ----------
function dash(){$('#ttl').textContent='Dashboard';
  const due=[];S.forEach(s=>sd(s[0]).hw.filter(h=>!h.done).forEach(h=>due.push({...h,s})));
  due.sort((a,b)=>(a.due||'9').localeCompare(b.due||'9'));
  const avg=k=>{const x=sd(k).scores;return x.length?Math.round(x.reduce((a,b)=>a+b.s/b.n,0)/x.length*100):null};
  const wk=S.map(s=>[s,avg(s[0])]).filter(x=>x[1]!=null).sort((a,b)=>a[1]-b[1])[0];
  $('#main').innerHTML=`<div class="max-w-3xl mx-auto space-y-4">
  <h2 class="font-extrabold text-xl">សួស្តី ${esc(ME.profile?.name||'')} 👋</h2>
  <div class="glass rounded-2xl p-4 flex items-center gap-4"><div class="text-4xl">🔥</div><div><p class="text-2xl font-extrabold">${streakN} day${streakN>1?'s':''} streak</p><p class="text-xs text-slate-400">today ${minsOn(today())}/${ME.profile?.goal||60} min · ${weekMin()} min this week${wk?` · Needs practice: ${wk[0][1]} (${wk[1]}%)`:''}</p></div></div>${missionsCard()}${examCard()}${mockCard()}
  <div class="glass rounded-2xl p-4"><h3 class="font-bold text-sm mb-2">កិច្ចការផ្ទះ · Homework to do</h3>${due.slice(0,8).map(h=>`<button data-a="gos" data-v="${h.s[0]}" class="w-full flex items-center gap-2 text-left text-sm py-1.5"><i class="fa-solid ${h.s[3]} w-5" style="color:${h.s[4]}"></i><span class="flex-1 truncate">${esc(h.t)}</span><span class="text-[11px] ${h.due&&h.due<today()?'text-red-400':'text-slate-400'}">${h.due||''}</span></button>`).join('')||'<p class="text-sm text-slate-400">Nothing due 🎉</p>'}</div>
  <div class="grid grid-cols-2 gap-3">${S.map(s=>{const p=sd(s[0]).hw.filter(h=>!h.done).length,a=avg(s[0]),cd=dueC(s[0]).length;return `<button data-a="gos" data-v="${s[0]}" class="glass rounded-2xl p-3 text-left hover:-translate-y-0.5 transition"><i class="fa-solid ${s[3]}" style="color:${s[4]}"></i><p class="font-bold text-sm mt-1">${s[1]}</p><p class="text-[11px] text-slate-400">${p} to do${a!=null?` · quiz ${a}%`:''}${cd?` · ${cd} cards`:''}</p></button>`}).join('')}</div></div>`}
A.gos=k=>go(k);

// ---------- FILES ----------
function files(){const d=sd(view);
  $('#pane').innerHTML=`<div class="flex gap-2 mb-3"><select id="tag" class="inp"><option>Lesson</option><option>Homework</option><option>Exam</option></select><label class="btn cursor-pointer whitespace-nowrap"><i class="fa-solid fa-upload mr-1"></i>Upload<input id="up" type="file" multiple accept=".pdf,.docx,.txt,.md,image/*" class="hide"></label></div>
  <div class="space-y-2">${d.files.map(f=>`<div class="flex items-center gap-2 bg-slate-900/60 rounded-xl p-2.5"><i class="fa-solid ${f.n?'fa-file-lines':'fa-image'} text-slate-400"></i><div class="min-w-0 flex-1"><p class="text-sm truncate">${esc(f.name)}</p><p class="text-[11px] text-slate-400">${f.tag} · ${f.d}${f.n?'':' · no text (AI cannot read it)'}</p></div><button data-a="open" data-v="${f.id}" class="text-blue-300 px-2" aria-label="Open"><i class="fa-solid fa-eye"></i></button><button data-a="delf" data-v="${f.id}" class="text-red-400 px-2" aria-label="Delete"><i class="fa-solid fa-trash"></i></button></div>`).join('')||'<p class="text-sm text-slate-400">No files yet. Upload a lesson, homework sheet or exam.</p>'}</div>
  <p class="text-[11px] text-slate-500 mt-3">The text of each file is saved to your account for the AI. The original file stays on the device you uploaded it from.</p>`;
  $('#up').onchange=upload}
async function extract(f){const n=f.name.toLowerCase();
  if(n.endsWith('.pdf')){const p=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let t='';for(let i=1;i<=p.numPages;i++)t+=(await(await p.getPage(i)).getTextContent()).items.map(x=>x.str).join(' ')+'\n';return t}
  if(n.endsWith('.docx'))return (await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()})).value;
  if(/\.(txt|md)$/.test(n))return f.text();
  if(f.type.startsWith('image/'))return await ask([{role:'user',content:[{type:'text',text:'Extract all the text in this image exactly as written (Khmer and English). Write maths in plain text. Return only the text.'},{type:'image_url',image_url:{url:await shrink(f,1600)}}]}],false,true)||'';
  return ''}
async function upload(e){const k=view,d=sd(k),tag=$('#tag').value;toast('Reading files…');
  for(const f of e.target.files){try{
    const t=(await extract(f)).trim().slice(0,200000),id=Date.now().toString(36)+Math.random().toString(36).slice(2,5);
    await idbPut(id,f);if(t)await setDoc(txtRef(k,id),{t});
    d.files.push({id,name:f.name,tag,d:today(),n:t.length})
  }catch(x){toast('Could not read '+f.name)}}
  await save(k);if(view==k&&tab=='files')pane();toast('Saved ✓')}
A.open=async id=>{const b=await idbGet(id);if(!b)return toast('The original is on another device. Its text is still saved here.');const a=document.createElement('a');a.href=URL.createObjectURL(b);a.target='_blank';a.click()};
A.delf=async id=>{if(!confirm('Delete this file?'))return;const k=view;sd(k).files=sd(k).files.filter(f=>f.id!=id);idbDel(id);deleteDoc(txtRef(k,id)).catch(()=>{});await save(k);pane()};

// ---------- NOTES ----------
function notes(){const k=view;

const VIS=['qwen/qwen3.8-27b','qwen/qwen3.6-27b','meta-models/muse-spark-open','meta-llama/llama-4-maverick-17b-128e-instruct','meta-llama/llama-4-scout-17b-16e-instruct'];
const PREF=['openai/gpt-oss-120b','llama-3.3-70b-versatile','qwen/qwen3.8-27b','openai/gpt-oss-20b','llama-3.1-8b-instant'];
const GEM=['gemini-flash-latest','gemini-2.5-flash'];
const GQ='https://api.groq.com/openai/v1/chat/completions',OR='https://openrouter.ai/api/v1/chat/completions',PL='https://text.pollinations.ai/openai',MS='https://api.mistral.ai/v1/chat/completions';

const kk=n=>own(n)||KEYS[n]||'';
const kl=n=>kk(n).split(/[\s,;]+/).filter(x=>x.length>8);
const shuf=a=>[...a].sort(()=>Math.random()-.5);
const jparse=t=>JSON.parse(String(t||'').replace(/^[\s\S]*?(\{[\s\S]*\})[\s\S]*$/,'$1'));
const okJ=k=>t=>{try{return jparse(t)[k].some(x=>x.q||x.f)}catch(e){return false}};
let AV=null,ERR='',WHO='',ORM=null;
const tf=async(u,o,ms=25000)=>{const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);try{return await fetch(u,{...o,signal:c.signal})}finally{clearTimeout(t)}};
async function avail(){if(!kk('groq'))return [];if(!AV?.length)try{const j=await (await tf('https://api.groq.com/openai/v1/models',{headers:{Authorization:'Bearer '+kl('groq')[0]}},8000)).json();AV=(j.data||[]).map(x=>x.id)}catch(e){AV=[]}return AV}
const orList=async()=>{if(!ORM)try{const j=await (await tf('https://openrouter.ai/api/v1/models',{},8000)).json();ORM=(j.data||[]).map(x=>x.id).filter(i=>i.endsWith(':free')&&/llama|gemma|qwen|deepseek|mistral|gpt-oss|glm/i.test(i)).slice(0,4)}catch(e){ORM=[]}return ORM};
async function oaCall(u,k,m,messages,json,vision){
  const r=await tf(u,{method:'POST',headers:{'Content-Type':'application/json',...(k?{Authorization:'Bearer '+k}:{})},body:JSON.stringify({model:m,messages,temperature:.4,max_tokens:vision?4000:3000,...(m.startsWith('openai/gpt-oss')?{reasoning_effort:'low'}:{}),...(json&&u==GQ?{response_format:{type:'json_object'}}:{})})},u==PL?35000:25000);
  if(!r.ok){let j={};try{j=await r.json()}catch(e){}throw new Error(r.status+' '+(j.error?.message||j.message||j[0]?.error?.message||'').slice(0,100))}
  return (await r.json()).choices?.[0]?.message?.content||''}
async function geminiCall(m,messages,json,key){
  const sm=messages.filter(x=>x.role=='system').map(x=>x.content).join('\n');
  const conv=messages.filter(x=>x.role!='system').map(x=>({role:x.role=='assistant'?'model':'user',parts:(Array.isArray(x.content)?x.content:[{type:'text',text:x.content}]).map(c=>{if(c.type=='image_url'){const [h,d]=c.image_url.url.split(',');return {inlineData:{mimeType:h.slice(5,h.indexOf(';')),data:d}}}return {text:c.text}})}));
  const r=await tf('https://generativelanguage.googleapis.com/v1beta/models/'+m+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify({...(sm?{systemInstruction:{parts:[{text:sm}]}}:{}),contents:conv,generationConfig:{temperature:.4,maxOutputTokens:6000,...(json?{responseMimeType:'application/json'}:{})}})});
  if(!r.ok){let j={};try{j=await r.json()}catch(e){}throw new Error(r.status+' '+(j.error?.message||'').slice(0,100))}
  return ((await r.json()).candidates?.[0]?.content?.parts||[]).map(x=>x.text||'').join('')}
async function ask(messages,json,vision,check){
  messages=messages.map(m=>({role:m.role,content:m.content}));
  ERR='';const t0=Date.now(),LOG=[],dead=new Set(),av=await avail(),bad=/whisper|tts|orpheus|guard|embed/i,L=[];
  shuf(kl('gemini')).slice(0,2).forEach(k=>GEM.forEach(m=>L.push({t:'g',m,k})));
  if(kk('groq')){let gl=(vision?VIS:PREF).filter(m=>av.includes(m));const more=av.filter(m=>!bad.test(m)&&!gl.includes(m));
    gl=[...gl,...(vision?more.filter(m=>/qwen|vision|scout|maverick|muse|gemma|pixtral/i.test(m)):more)].slice(0,vision?5:6);
    if(!av.length)gl=(vision?VIS:PREF).slice(0,2);gl.slice(0,3).forEach(m=>shuf(kl('groq')).slice(0,3).forEach(k=>L.push({t:'o',m,u:GQ,k})))}
  if(kk('mistral'))L.push({t:'o',m:'mistral-small-latest',u:MS,k:kl('mistral')[0]});
  if(!vision&&kk('openrouter'))(await orList()).forEach(m=>L.push({t:'o',m,u:OR,k:kl('openrouter')[0]}));
  if(!vision)L.push({t:'o',m:'openai',u:PL,k:''});
  for(const x of L){const dk=(x.t=='g'?'g':x.u)+x.k;if(dead.has(dk))continue;if(Date.now()-t0>60000)break;try{
    let t=x.t=='g'?await geminiCall(x.m,messages,json,x.k):await oaCall(x.u,x.k,x.m,messages,json,vision);
    t=(t||'').replace(/<think>[\s\S]*?<\/think>/g,'').trim();
    if(!t)throw new Error('empty answer');if(check&&!check(t))throw new Error('wrong format');
    WHO=(x.t=='g'?'Gemini':x.u==GQ?'Groq':x.u==OR?'OpenRouter':x.u==MS?'Mistral':'Free fallback')+' · '+x.m;return t
  }catch(e){const m=e.name=='AbortError'?'timed out':e.message||'network error';LOG.push(x.m+' → '+m);if(/\b(401|403)\b|API key|unauthor/i.test(m))dead.add(dk)}}
  ERR=LOG.slice(-3).join(' | ')||'no AI is set up. Add a key in Profile.';return null}
async function diag(){const msg=[{role:'user',content:'Reply with the single word OK'}];
  const T=[['Gemini',kk('gemini')&&(()=>geminiCall(GEM[0],msg,kl('gemini')[0]))],['Groq',kk('groq')&&(()=>oaCall(GQ,kl('groq')[0],'llama-3.3-70b-versatile',msg))],['Mistral',kk('mistral')&&(()=>oaCall(MS,kl('mistral')[0],'mistral-small-latest',msg))],['OpenRouter',kk('openrouter')&&(async()=>oaCall(OR,kl('openrouter')[0],(await orList())[0],msg))],['Free fallback',()=>oaCall(PL,'','openai',msg)]];
  return (await Promise.all(T.map(async([n,f])=>{if(!f)return '➖ '+n+': no key / not connected';try{return (await f())?'✅ '+n+': working':'❌ '+n+': empty answer'}catch(e){return '❌ '+n+': '+hint(e.name=='AbortError'?'timed out':e.message)}}))).join('\n')}
const sys=k=>`You are an expert, kind ${subj(k)[2]} (${subj(k)[1]}) teacher in Cambodia, tutoring ${ME.profile?.name||'a student'} (Grade 12, class NGS B), following the Cambodian national curriculum. ${k=='eng'?'This is the English language subject: explain in simple Khmer and give the examples in English.':sd(k).lang=='en'?'Reply in English.':'Reply ONLY in simple, natural Khmer (keep key technical terms in English in brackets).'} Give the answer first, then short numbered steps. Write all maths and chemistry formulas in LaTeX between $...$ (inline) or $$...$$ (display). If the wording is unclear or has typos, guess what a Cambodian textbook means, say your guess in one line, and answer it. Ask a question back only if you truly cannot answer. Never invent facts; if unsure, say so. If asked who you are, say you are the Study Hub AI tutor for Grade 12 NGS B.`;
const LQ=k=>k=='eng'?'Write the questions and options in English and the explanations in Khmer.':'Write ALL questions, options and explanations in Khmer (keep key technical terms in English in brackets).';
const srcSel=k=>`<select id="src" class="inp"><option value="">No file (general)</option><option value="notes">My notes</option>${sd(k).files.filter(f=>f.n).map(f=>`<option value="${f.id}">${esc(f.name)}</option>`).join('')}</select>`;
async function getSrc(k,v){if(!v)return'';if(v=='notes')return sd(k).notes;const r=await getDoc(txtRef(k,v));return r.exists()?r.data().t:''}
function md(t){const M=[];t=t.replace(/\$\$[\s\S]+?\$\$|\$[^$\n]+?\$|\\\([\s\S]+?\\\)|\\\[[\s\S]+?\\\]/g,m=>{M.push(m);return '@@M'+(M.length-1)+'@@'});return marked.parse(t.replace(/</g,'&lt;')).replace(/@@M(\d+)@@/g,(_,i)=>esc(M[i]))}
const rm=el=>{try{renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'\\[',right:'\\]',display:true},{left:'\\(',right:'\\)',display:false},{left:'$',right:'$',display:false}],throwOnError:false})}catch(e){}};
const bub=(m,i)=>m.role=='user'?`<div class="no-tr ml-10 rounded-2xl rounded-br-md p-3 text-[0.95rem] leading-relaxed bg-gradient-to-r from-blue-600 to-indigo-600 text-white">${esc(m.content)}</div>`:`<div class="mr-4 rounded-2xl rounded-bl-md p-3 text-[0.95rem] leading-relaxed bg-slate-800/80"><div class="md">${md(m.content)}</div><div class="flex items-center gap-2 mt-1.5"><button data-a="say" data-v="${i}" class="text-slate-400" aria-label="Read aloud"><i class="fa-solid fa-volume-high"></i></button><span class="text-[11px] text-slate-500">${m.by?'via '+esc(m.by):''}</span></div></div>`;

const shrink=(f,mx=1280)=>new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,mx/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.82))};i.src=URL.createObjectURL(f)});

tered/,'ប័ណ្ណចាំបាន'],[/Strongest/,'ខ្លាំងជាងគេ'],[/Needs work/,'ត្រូវកែលម្អ'],[/^Most studied: /,'រៀនច្រើនជាងគេ៖ '],[/^(\d+)h (\d+)m$/,'$1ម៉ោង $2នាទី'],[/7-day streak/,'រៀនជាប់ៗ ៧ ថ្ងៃ'],[/10 hours studied/,'រៀន ១០ ម៉ោង'],[/10 quizzes/,'ធ្វើសំណួរ ១០ដង'],[/50 cards mastered/,'ចាំប័ណ្ណ ៥០'],[/Quiz 80%\+/,'ពិន្ទុ ៨០%+'],[/10 files saved/,'រក្សាទុកឯកសារ ១០'],[/Mock exam 80%\+/,'ប្រឡងសាកល្បង ៨០%+'],[/Studied every subject/,'រៀនគ្រប់មុខវិជ្ជា'],[/No answer/,'គ្មានចម្លើយ'],[/^(Lesson|Homework|Exam) · /,(m,a)=>KH[a]+' · '],[/ · no text \(AI cannot read it\)/,' · គ្មានអត្ថបទ (AI អានមិនបាន)'],[/\(you\)$/,'(អ្នក)'],[/(\d+) to do/,'$1 ត្រូវធ្វើ'],[/ quiz (\d+)%/g,' ពិន្ទុ $1%'],[/^quiz (\d+)%/,'ពិន្ទុ $1%'],[/ (\d+) cards$/,' $1 ប័ណ្ណ'],[/^(\d+) days$/,'$1 ថ្ងៃ'],[/(\d+) min\b/g,'$1 នាទី']];
const tr=s=>{const t=s.trim();if(!t||!/[A-Za-z]/.test(t))return s;let o=KH[t];if(o==null){o=t;for(const [r,x] of KR)o=o.replace(r,x)}return o===t?s:s.replace(t,o)};
/*TR_END*/
function trNode(n){if(n.nodeType==3){const v=tr(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v}else if(n.nodeType==1){if(/^(SCRIPT|STYLE|TEXTAREA|CODE|PRE)$/.test(n.tagName)||n.closest('.md,.no-tr'))return;['placeholder','title','aria-label'].forEach(a=>{const v=n.getAttribute(a);if(v){const w=tr(v);if(w!==v)n.setAttribute(a,w)}});n.childNodes.forEach(trNode)}}
new MutationObserver(ms=>ms.forEach(m=>{if(m.type=='childList')m.addedNodes.forEach(trNode);else if(m.type=='characterData')trNode(m.target)})).observe(document.body,{childList:true,subtree:true,characterData:true});
trNode(document.body);
