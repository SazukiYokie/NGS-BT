async function streak(){
  const r=doc(db,'users',U.uid),s=(await getDoc(r)).data()||{},t=today(),y=new Date(Date.now()-864e5).toLocaleDateString('en-CA');

      prog('កំពុងស្កេនទំព័រ '+pg[0]+'–'+pg[pg.length-1]+' (ស្កេនសរុប '+need.length+' ទំព័រ) សូមកុំបិទកម្មវិធី…');
      const msg=[{role:'user',content:[{type:'text',text:'Transcribe ALL the text on these '+imgs.length+' scanned textbook pages exactly as written (Khmer and English), keeping formulas as plain text or LaTeX. The pages in order are: '+pg.join(', ')+'. Start each page with a line "--- ទំព័រ N ---". Return only the transcription.'},...imgs.map(u=>({type:'image_url',image_url:{url:u}}))]}];
      let r=await ask(msg,false,true);if(!r){await sleep(8000);r=await ask(msg,false,true)}
      if(!r){r='';for(let k=0;k<pg.length;k++)r+='--- ទំព័រ '+pg[k]+' ---\n'+(await ocr(imgs[k]))+'\n'}

}

async function oaCall(u,k,m,messages,json,vision){

  if(!r.ok){let j={};try{j=await r.json()}catch(e){}throw new Error(r.status+' '+(j.error?.message||j.message||'').slice(0,95))}
  const data=await r.json();
  return data.choices?.[0]?.message?.content||'';
}

async function ask(messages,json,vision,check){
  messages=messages.map(m=>({role:m.role,content:m.content}));
  ERR='';const t0=Date.now(),EM={},dead=new Set(),L=[],gKeys=kl('groq');

    else{models=PREF.filter(m=>av.includes(m));if(av.length)models=[...new Set([...models,...av])];if(!models.length)models=['openai/gpt-oss-20b','llama-3.3-70b-versatile']}
    models.slice(0,4).forEach(m=>shuf(gKeys).slice(0,2).forEach(k=>L.push({m,u:GQ,k})));
  }
  const orKeys=kl('openrouter');
  if(orKeys.length)(vision?await orVis():(await orList()).slice(0,4)).forEach(m=>L.push({m,u:OR,k:orKeys[0]}));
  L.push({m:'openai',u:PL,k:''});if(!vision)L.push({m:'openai-fast',u:PL,k:''});
  for(const x of L){
    const dk=x.u+'|'+x.k;if(dead.has(dk))continue;if(Date.now()-t0>55000)break;
    try{
      let t=await oaCall(x.u,x.k,x.m,messages,json,vision);
      t=(t||'').replace(/<think>[\s\S]*?<\/think>/g,'').trim();
      if(!t)throw new Error('គ្មានចម្លើយ');
      if(check&&!check(t))throw new Error('ទម្រង់មិនត្រឹមត្រូវ');
      WHO=(x.u==GQ?'Groq':x.u==OR?'OpenRouter':'AI បម្រុង')+' · '+x.m.split('/').pop();
      return t;
    }catch(e){
      const m=e.name=='AbortError'?'អស់ពេលរង់ចាំ':e.message||'កំហុសបណ្តាញ',lb=x.u==GQ?'Groq':x.u==OR?'OpenRouter':'AI បម្រុង';
      EM[lb]=EM[lb]||x.m.split('/').pop()+' → '+m;
      if(/\b(401|403)\b|invalid_api_key|unauthor/i.test(m))dead.add(dk);
    }
  }

  return null;
}

const TXT={};let LASTSRC=[];
async function getRel(k,q,max=8000,tag=''){
  const d=sd(k),docs=[];
  if(d.notes.trim())docs.push(['កំណត់ត្រា',d.notes.slice(0,6000)]);
  for(const f of d.files.filter(f=>f.n&&(!tag||f.tag==tag)).slice(-25)){try{let t=TXT[f.id];if(t==null){const r=await getDoc(txtRef(k,f.id));t=TXT[f.id]=r.exists()?r.data().t:''}if(t)docs.push([f.tag+': '+f.name,t])}catch(e){}}
  const ALL=[];docs.forEach(([n,t])=>{t.split(/(?=--- ទំព័រ \d+ ---)/).forEach(sg=>{const pg=+((sg.match(/^--- ទំព័រ (\d+) ---/)||[])[1]||0);for(let i=0;i<sg.length;i+=900)ALL.push({n,pg,t:sg.slice(i,i+900),i})})});
  const qn=(q||'').replace(/[០-៩]/g,d=>'០១២៣៤៥៦៧៨៩'.indexOf(d)),pm=qn.match(/(?:ទំព័រ|pages?)\s*(\d+)\s*(?:[-–—~]|ដល់|to)\s*(\d+)/i)||qn.match(/(?:ទំព័រ|page)\s*(\d+)()/i);
  let ch=ALL;if(pm){const a=+pm[1],b=+(pm[2]||pm[1]),inr=ALL.filter(c=>c.pg>=a&&c.pg<=b);if(inr.length)ch=inr}
  const g=x=>{const a=x.replace(/\s+/g,'').toLowerCase(),m=new Set;for(let i=0;i<a.length-2;i++)m.add(a.slice(i,i+3));return m},qs=g(q||'');
  ch.forEach(c=>{if(!qs.size){c.s=Math.random()-c.i/1e5;return}let n=0;g(c.t).forEach(x=>{if(qs.has(x))n++});c.s=n});
  ch.sort((a,b)=>b.s-a.s);let o='';const used=new Set;
  for(const c of ch){if(o.length+c.t.length>max)break;o+='['+c.n+(c.pg?' · ទំព័រ '+c.pg:'')+']\n'+c.t+'\n\n';used.add(c.n)}
  LASTSRC=[...used];return o;
}
async function getSrc(k,v,q){
  LASTSRC=[];if(v&&v!='all'&&v!='notes'){const f=sd(k).files.find(x=>x.id==v);if(f)LASTSRC=[f.name]}
  if(!v)return'';if(v=='notes')return sd(k).notes;
  if(v=='all')return getRel(k,q);
  if(v=='all-old'){const d=sd(k);let o=d.notes.trim()?'[កំណត់ត្រា]\n'+d.notes.slice(0,3000)+'\n\n':'';for(const f of d.files.filter(f=>f.n).slice(-6)){try{const r=await getDoc(txtRef(k,f.id));if(r.exists())o+=`[${f.tag}: ${f.name}]\n`+r.data().t.slice(0,3500)+'\n\n'}catch(e){}}return o}
  const r=await getDoc(txtRef(k,v));return r.exists()?r.data().t:'';
}

function md(t){
  const M=[];
  t=String(t||'').replace(/\$\$[\s\S]+?\$\$|\$[^$\n]+?\$|\\\([\s\S]+?\\\)|\\\[[\s\S]+?\\\]/g,m=>{M.push(m);return '@@M'+(M.length-1)+'@@'});

    <div class="flex gap-2"><select id="qn" class="inp"><option value="5">៥ សំណួរ</option><option value="10">១០ សំណួរ</option></select><select id="ql" class="inp"><option value="easy">កម្រិតងាយ</option><option value="medium" selected>កម្រិតមធ្យម</option><option value="hard">កម្រិតពិបាក (បាក់ឌុប)</option></select></div>
  </div>
  <div id="qz"></div>
  ${last.length?`<p class="text-xs text-slate-400 mt-3">ពិន្ទុថ្មីៗ៖ ${last.map(s=>`${s.s}/${s.n} (${s.d})`).join(' · ')}</p>`:''}`;
}
A.mk=async(_,b)=>{
  const k=view,N=+$('#qn').value,LV=$('#ql').value;b.disabled=true;$('#qz').innerHTML='<p class="text-sm text-slate-400">កំពុងបង្កើតសំណួរតេស្ត…</p>';
  const top=$('#qt').value.trim(),ctx=await getSrc(k,$('#src').value,top);
  const r=await ask([{role:'system',content:sys(k)+' Return ONLY valid JSON like {"questions":[{"q":"","options":["","","",""],"answer":0,"why":""}]} with '+N+' '+LV+' multiple-choice questions. Write math in plain unicode (x², √, Δ). '+LQ(k)+' "answer" is the index 0-3 of the correct option.'},{role:'user',content:`Make ${N} questions${top?` about: ${top}`:''}.${ctx?`\nBase them on:\n"""${ctx.slice(0,6500)}"""`:''}`}],true,false,okJ('questions'));
  b.disabled=false;let qs;try{qs=jparse(r).questions.filter(x=>x.q&&x.options?.length==4)}catch(e){}
  if(!qs?.length){if($('#qz'))$('#qz').innerHTML='<p class="text-sm text-amber-300">មិនអាចបង្កើតសំណួរបានទេ សូមព្យាយាមម្តងទៀត។</p>';return}
  Q={k,qs,i:0,s:0};showQ();
};
function showQ(){
  const z=$('#qz');if(!z)return;const q=Q.qs[Q.i];
  if(!q){const n=Q.qs.length,d=sd(Q.k);d.scores=[...d.scores,{s:Q.s,n,d:today()}].slice(-20);save(Q.k);z.innerHTML=`<div class="text-center py-5"><p class="text-4xl font-extrabold text-emerald-400">${Q.s}/${n}</p><p class="text-sm text-slate-400 mt-1">បានរក្សាទុកពិន្ទុ ✓</p></div>`;return}
  z.innerHTML=`<p class="text-xs text-slate-400 mb-1">សំណួរទី ${Q.i+1}/${Q.qs.length}</p><p class="font-semibold mb-3">${esc(q.q)}</p>`+q.options.map((o,j)=>`<button data-a="pick" data-v="${j}" class="qo w-full text-left p-3 mb-2 rounded-xl glass-soft text-sm transition">${esc(o)}</button>`).join('')+'<div id="qw"></div>';rm(z);
}
A.pick=j=>{
  if(Q.done)return;Q.done=true;const q=Q.qs[Q.i],a=+q.answer;j=+j;if(j==a)Q.s++;else{const d=sd(Q.k);(d.cards=d.cards||[]).push({f:q.q,b:q.options[a],box:1,due:today()});(d.mist=d.mist||[]).push({i:Date.now().toString(36),q:q.q,o:q.options,a,m:j,d:today()});d.mist=d.mist.slice(-100)}
  document.querySelectorAll('.qo').forEach((e,i)=>{if(i==a)e.classList.add('!bg-emerald-600/30','!border-emerald-500');else if(i==j)e.classList.add('!bg-red-600/30','!border-red-500')});
  $('#qw').innerHTML=`<p class="text-sm text-slate-300 my-2.5 p-3 rounded-xl bg-slate-900/60">${esc(q.why||'')}</p><button data-a="nx" class="btn w-full">${Q.i+1<Q.qs.length?'សំណួរបន្ទាប់ →':'មើលលទ្ធផល'}</button>`;rm($('#qw'));
};
A.nx=()=>{Q.i++;Q.done=false;showQ()};
</script>
