<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Study Hub — My School Space</title>
<meta name="theme-color" content="#0f172a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Cpath d='M32 14 8 26l24 12 24-12-24-12zm-14 20v10c0 4 6 8 14 8s14-4 14-8V34l-14 7-14-7z' fill='white'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Hanuman:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['Inter','Hanuman','sans-serif']}}}}</script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<style>
html,body{height:100%;height:100dvh;margin:0;background:#050814;color:#f8fafc;overflow-x:hidden}
.hide{display:none!important}
.orb{position:fixed;border-radius:9999px;filter:blur(85px);opacity:.3;pointer-events:none;z-index:0;animation:fl 12s infinite ease-in-out alternate}
@keyframes fl{to{transform:translate(40px,-30px) scale(1.15)}}
.glass{background:rgba(15,23,42,.76);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(148,163,184,.16)}
.btn{background:linear-gradient(90deg,#2563eb,#4f46e5);color:#fff;font-weight:600;padding:.6rem 1rem;border-radius:.75rem;font-size:.85rem}
.btn:disabled{opacity:.5}
.inp{width:100%;min-width:0;background:rgba(2,6,23,.6);border:1px solid rgba(148,163,184,.25);border-radius:.75rem;padding:.6rem .8rem;font-size:.9rem;color:#f8fafc}
.inp option{background:#0f172a}
.tab{padding:.5rem .9rem;border-radius:.75rem;font-size:.8rem;font-weight:600;white-space:nowrap;color:#cbd5e1}
.tab.on{background:var(--c);color:#fff}
.md p{margin:.4rem 0}.md ul{list-style:disc;padding-left:1.2rem}.md ol{list-style:decimal;padding-left:1.2rem}
.md code{background:#0008;padding:0 .25rem;border-radius:.25rem}.md pre{background:#0008;padding:.6rem;border-radius:.5rem;overflow-x:auto}
</style>
</head>
<body class="font-sans">
<div class="orb" style="width:380px;height:380px;background:#3b82f6;top:-80px;left:-80px"></div>
<div class="orb" style="width:400px;height:400px;background:#8b5cf6;bottom:-90px;right:-60px;animation-delay:-4s"></div>

<!-- LOGIN -->
<div id="auth" class="relative z-10 min-h-full flex items-center justify-center p-4">
  <div class="glass rounded-2xl p-6 w-full max-w-sm space-y-3">
    <div class="text-center">
      <div class="w-12 h-12 mx-auto rounded-xl bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center"><i class="fa-solid fa-graduation-cap text-xl"></i></div>
      <h1 class="font-extrabold text-xl mt-2">Study Hub<span class="text-blue-400">.</span></h1>
      <p class="text-xs text-slate-400">My school space · កន្លែងសិក្សារបស់ខ្ញុំ</p>
    </div>
    <input id="em" type="email" class="inp" placeholder="Email" autocomplete="email">
    <input id="pw" type="password" class="inp" placeholder="Password (6+ characters)" autocomplete="current-password">
    <p id="amsg" class="text-xs text-amber-300 hide"></p>
    <button id="bgo" class="btn w-full">Log in</button>
    <div class="flex justify-between text-xs text-blue-300"><button id="bmode">Create account</button><button id="bforgot">Forgot password?</button></div>
  </div>
</div>

<!-- APP -->
<div id="app" class="hide relative z-10 h-full flex">
  <div id="ov" class="hide fixed inset-0 bg-black/60 z-30 md:hidden"></div>
  <aside id="side" class="glass fixed md:static z-40 inset-y-0 left-0 w-64 -translate-x-full md:translate-x-0 transition-transform flex flex-col">
    <div class="p-4 font-extrabold border-b border-slate-700/50"><i class="fa-solid fa-graduation-cap text-blue-400 mr-2"></i>Study Hub<span class="text-blue-400">.</span></div>
    <nav id="nav" class="p-2 space-y-1 overflow-y-auto flex-1"></nav>
    <button id="out" class="m-2 p-2.5 rounded-xl text-red-400 text-sm text-left hover:bg-red-500/10"><i class="fa-solid fa-right-from-bracket w-5"></i>ចាកចេញ · Sign out</button>
  </aside>
  <main class="flex-1 min-w-0 flex flex-col h-full">
    <header class="glass md:hidden flex items-center gap-3 p-3"><button id="burger" aria-label="Menu"><i class="fa-solid fa-bars"></i></button><span id="ttl" class="font-bold text-sm">Dashboard</span></header>
    <div id="main" class="flex-1 overflow-y-auto p-4 md:p-6"></div>
  </main>
</div>
<div id="toast" class="hide fixed bottom-5 left-1/2 -translate-x-1/2 z-50 glass rounded-xl px-4 py-2 text-sm"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,signInWithEmailAndPassword as si,createUserWithEmailAndPassword as su,sendPasswordResetEmail as fp,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,setDoc,getDoc,getDocs,deleteDoc,collection} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyDK4s6dw-Rm_pK1zEABEbSbTz7_5gPk_4k",authDomain:"ngs-bt.firebaseapp.com",projectId:"ngs-bt",storageBucket:"ngs-bt.firebasestorage.app",messagingSenderId:"1087138498515",appId:"1:1087138498515:web:366cf3dbefd2ddbcadd126"};
const GROQ="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";
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// key, Khmer name, English name, icon, colour
const S=[["math","គណិតវិទ្យា","Math","fa-square-root-variable","#3b82f6"],["chem","គីមីវិទ្យា","Chemistry","fa-flask","#10b981"],["phys","រូបវិទ្យា","Physics","fa-atom","#8b5cf6"],["bio","ជីវវិទ្យា","Biology","fa-dna","#22c55e"],["geo","ភូមិវិទ្យា","Geography","fa-earth-asia","#06b6d4"],["civ","សីលធម៍ពលរដ្ឋ","Civics & Morality","fa-scale-balanced","#f59e0b"],["eng","ភាសាអង់គ្លេស","English","fa-language","#ec4899"],["earth","ផែនដីវិទ្យា","Earth Science","fa-mountain","#f97316"],["khm","ភាសាខ្មែរ","Khmer Language","fa-book-open","#ef4444"],["hist","ប្រវត្តិវិទ្យា","History","fa-landmark","#a78bfa"]];
const T=[["files","ឯកសារ","Files","fa-folder-open"],["notes","កំណត់ត្រា","Notes","fa-note-sticky"],["hw","កិច្ចការផ្ទះ","Homework","fa-list-check"],["ai","គ្រូ AI","AI Tutor","fa-wand-magic-sparkles"],["quiz","សំណួរ","Quiz","fa-circle-question"],["time","ម៉ោងសិក្សា","Timer","fa-stopwatch"]];

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toLocaleDateString('en-CA');
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.remove('hide');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.add('hide'),2600)};
const subj=k=>S.find(x=>x[0]==k);
let U,D={},view='dash',tab='files',chat={},Q,streakN=1,ME={},TM=null,IMG=null;
const sd=k=>D[k]||(D[k]={notes:'',hw:[],files:[],scores:[],lang:'km'});
const save=k=>setDoc(doc(db,'users',U.uid,'subjects',k),sd(k)).catch(e=>toast('Save failed: '+e.code));
const txtRef=(k,id)=>doc(db,'users',U.uid,'subjects',k,'texts',id);

// original files stay on this device (free, no Storage plan needed)
const idb=new Promise(r=>{const q=indexedDB.open('studyhub',1);q.onupgradeneeded=()=>q.result.createObjectStore('f');q.onsuccess=()=>r(q.result)});
const idbPut=async(k,v)=>(await idb).transaction('f','readwrite').objectStore('f').put(v,k);
const idbDel=async k=>(await idb).transaction('f','readwrite').objectStore('f').delete(k);
const idbGet=async k=>{const d=await idb;return new Promise(r=>{const q=d.transaction('f').objectStore('f').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()})};

// ---------- AUTH ----------
let mode='in';
const am=t=>{const e=$('#amsg');e.textContent=t;e.classList.remove('hide')};
$('#bmode').onclick=()=>{mode=mode=='in'?'up':'in';$('#bgo').textContent=mode=='in'?'Log in':'Create account';$('#bmode').textContent=mode=='in'?'Create account':'I have an account'};
$('#bgo').onclick=async()=>{try{await (mode=='in'?si:su)(auth,$('#em').value.trim(),$('#pw').value)}catch(e){am((e.code||e.message).replace('auth/','').replace(/-/g,' '))}};
$('#bforgot').onclick=async()=>{try{await fp(auth,$('#em').value.trim());am('Reset email sent. Check your inbox.')}catch(e){am('Type your email first.')}};
$('#out').onclick=()=>signOut(auth);
const side=o=>{$('#side').classList.toggle('-translate-x-full',!o);$('#ov').classList.toggle('hide',!o)};
$('#burger').onclick=()=>side(true);$('#ov').onclick=()=>side(false);

async function streak(){const r=doc(db,'users',U.uid),s=(await getDoc(r)).data()||{},t=today(),y=new Date(Date.now()-864e5).toLocaleDateString('en-CA');
  if(s.last!==t){s.streak=s.last===y?(s.streak||0)+1:1;s.last=t;await setDoc(r,s,{merge:true}).catch(()=>{})}
  ME=s;return s.streak||1}

onAuthStateChanged(auth,async u=>{U=u;$('#auth').classList.toggle('hide',!!u);$('#app').classList.toggle('hide',!u);
  if(!u){D={};chat={};if(TM){clearInterval(TM.iv);TM=null}return}
  try{(await getDocs(collection(db,'users',u.uid,'subjects'))).forEach(d=>D[d.id]={...sd(d.id),...d.data()});streakN=await streak()}catch(e){toast('Could not load your data: '+(e.code||''))}
  go('dash')});

// ---------- NAV ----------
function nav(){$('#nav').innerHTML=[['dash','ទំព័រដើម','fa-house','#60a5fa'],...S.map(s=>[s[0],s[1],s[3],s[4]])].map(([k,n,i,c])=>`<button data-k="${k}" class="w-full flex items-center gap-3 p-2.5 rounded-xl text-sm text-slate-300 hover:bg-slate-800/60 text-left ${view==k?'bg-slate-800 font-semibold':''}"><i class="fa-solid ${i} w-5" style="color:${c}"></i>${n}</button>`).join('')}
$('#nav').onclick=e=>{const b=e.target.closest('[data-k]');if(b)go(b.dataset.k)};
function go(k){view=k;tab='files';side(false);nav();render()}

function render(){
  if(view=='dash')return dash();
  const s=subj(view);$('#ttl').textContent=s[1];
  $('#main').innerHTML=`<div class="max-w-3xl mx-auto space-y-4" style="--c:${s[4]}">
  <div class="flex items-center gap-3"><div class="w-11 h-11 rounded-xl flex items-center justify-center" style="background:${s[4]}33;color:${s[4]}"><i class="fa-solid ${s[3]} text-lg"></i></div><div><h2 class="font-extrabold text-xl">${s[1]}</h2><p class="text-xs text-slate-400">${s[2]}</p></div></div>
  <div class="flex gap-1 overflow-x-auto">${T.map(([k,kh,en,i])=>`<button data-t="${k}" class="tab text-center ${tab==k?'on':''}"><i class="fa-solid ${i}"></i><span class="block leading-tight mt-0.5">${kh}</span><span class="block text-[9px] opacity-70">${en}</span></button>`).join('')}</div>
  <div id="pane" class="glass rounded-2xl p-4"></div></div>`;
  pane()}
const pane=()=>({files,notes,hw,ai,quiz,time})[tab]();
const A={};
$('#main').onclick=e=>{const b=e.target.closest('[data-t],[data-a]');if(!b)return;if(b.dataset.t){tab=b.dataset.t;render();return}A[b.dataset.a]?.(b.dataset.v,b)};

// ---------- DASHBOARD ----------
function dash(){$('#ttl').textContent='Dashboard';
  const due=[];S.forEach(s=>sd(s[0]).hw.filter(h=>!h.done).forEach(h=>due.push({...h,s})));
  due.sort((a,b)=>(a.due||'9').localeCompare(b.due||'9'));
  const avg=k=>{const x=sd(k).scores;return x.length?Math.round(x.reduce((a,b)=>a+b.s/b.n,0)/x.length*100):null};
  const wk=S.map(s=>[s,avg(s[0])]).filter(x=>x[1]!=null).sort((a,b)=>a[1]-b[1])[0];
  $('#main').innerHTML=`<div class="max-w-3xl mx-auto space-y-4">
  <div class="glass rounded-2xl p-4 flex items-center gap-4"><div class="text-4xl">🔥</div><div><p class="text-2xl font-extrabold">${streakN} day${streakN>1?'s':''} streak</p><p class="text-xs text-slate-400">${weekMin()} min studied this week${wk?` · Needs practice: ${wk[0][1]} (${wk[1]}%)`:''}</p></div></div>${examCard()}
  <div class="glass rounded-2xl p-4"><h3 class="font-bold text-sm mb-2">កិច្ចការផ្ទះ · Homework to do</h3>${due.slice(0,8).map(h=>`<button data-a="gos" data-v="${h.s[0]}" class="w-full flex items-center gap-2 text-left text-sm py-1.5"><i class="fa-solid ${h.s[3]} w-5" style="color:${h.s[4]}"></i><span class="flex-1 truncate">${esc(h.t)}</span><span class="text-[11px] ${h.due&&h.due<today()?'text-red-400':'text-slate-400'}">${h.due||''}</span></button>`).join('')||'<p class="text-sm text-slate-400">Nothing due 🎉</p>'}</div>
  <div class="grid grid-cols-2 gap-3">${S.map(s=>{const p=sd(s[0]).hw.filter(h=>!h.done).length,a=avg(s[0]);return `<button data-a="gos" data-v="${s[0]}" class="glass rounded-2xl p-3 text-left hover:-translate-y-0.5 transition"><i class="fa-solid ${s[3]}" style="color:${s[4]}"></i><p class="font-bold text-sm mt-1">${s[1]}</p><p class="text-[11px] text-slate-400">${p} to do${a!=null?` · quiz ${a}%`:''}</p></button>`}).join('')}</div></div>`}
A.gos=k=>go(k);

// ---------- FILES ----------
function files(){const d=sd(view);
  $('#pane').innerHTML=`<div class="flex gap-2 mb-3"><select id="tag" class="inp"><option>Lesson</option><option>Homework</option><option>Exam</option></select><label class="btn cursor-pointer whitespace-nowrap"><i class="fa-solid fa-upload mr-1"></i>Upload<input id="up" type="file" multiple accept=".pdf,.docx,.txt,.md,image/*" class="hide"></label></div>
  <div class="space-y-2">${d.files.map(f=>`<div class="flex items-center gap-2 bg-slate-900/60 rounded-xl p-2.5"><i class="fa-solid ${f.n?'fa-file-lines':'fa-image'} text-slate-400"></i><div class="min-w-0 flex-1"><p class="text-sm truncate">${esc(f.name)}</p><p class="text-[11px] text-slate-400">${f.tag} · ${f.d}${f.n?'':' · no text (AI cannot read it)'}</p></div><button data-a="open" data-v="${f.id}" class="text-blue-300 px-2" aria-label="Open"><i class="fa-solid fa-eye"></i></button><button data-a="delf" data-v="${f.id}" class="text-red-400 px-2" aria-label="Delete"><i class="fa-solid fa-trash"></i></button></div>`).join('')||'<p class="text-sm text-slate-400">No files yet. Upload a lesson, homework sheet or exam.</p>'}</div>
  <p class="text-[11px] text-slate-500 mt-3">The text of each file is saved to your account for the AI. The original file stays on the device you uploaded it from.</p>`;
  $('#up').onchange=upload}
async function extract(f){const n=f.name.toLowerCase();
  if(n.endsWith('.pdf')){const p=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let t='';for(let i=1;i<=p.numPages;i++)t+=(await(await p.getPage(i)).getTextContent()).items.map(x=>x.str).join(' ')+'\n';return t}
  if(n.endsWith('.docx'))return (await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()})).value;
  if(/\.(txt|md)$/.test(n))return f.text();
  return ''}
async function upload(e){const k=view,d=sd(k),tag=$('#tag').value;toast('Reading files…');
  for(const f of e.target.files){try{
    const t=(await extract(f)).trim().slice(0,200000),id=Date.now().toString(36)+Math.random().toString(36).slice(2,5);
    await idbPut(id,f);if(t)await setDoc(txtRef(k,id),{t});
    d.files.push({id,name:f.name,tag,d:today(),n:t.length})
  }catch(x){toast('Could not read '+f.name)}}
  await save(k);if(view==k&&tab=='files')pane();toast('Saved ✓')}
A.open=async id=>{const b=await idbGet(id);if(!b)return toast('The original is on another device. Its text is still saved here.');const a=document.createElement('a');a.href=URL.createObjectURL(b);a.target='_blank';a.click()};
A.delf=async id=>{if(!confirm('Delete this file?'))return;const k=view;sd(k).files=sd(k).files.filter(f=>f.id!=id);idbDel(id);deleteDoc(txtRef(k,id)).catch(()=>{});await save(k);pane()};

// ---------- NOTES ----------
function notes(){const k=view;
  $('#pane').innerHTML=`<textarea id="nt" rows="14" class="inp" placeholder="Write your notes…">${esc(sd(k).notes)}</textarea><p id="ns" class="text-[11px] text-slate-500 mt-1">Saves automatically</p>`;
  $('#nt').oninput=e=>{sd(k).notes=e.target.value;clearTimeout(notes.t);$('#ns').textContent='Saving…';notes.t=setTimeout(async()=>{await save(k);const n=$('#ns');if(n)n.textContent='Saved ✓'},800)}}

// ---------- HOMEWORK ----------
function hw(){const l=[...sd(view).hw].sort((a,b)=>a.done-b.done||(a.due||'9').localeCompare(b.due||'9'));
  $('#pane').innerHTML=`<div class="flex gap-2 mb-3 flex-wrap"><input id="ht" class="inp flex-1" placeholder="New homework…"><input id="hd" type="date" class="inp w-auto"><button data-a="addhw" class="btn" aria-label="Add"><i class="fa-solid fa-plus"></i></button></div>`+
  (l.map(h=>`<div class="flex items-center gap-2.5 p-2.5 rounded-xl bg-slate-900/60 mb-2"><input type="checkbox" data-a="tg" data-v="${h.id}" ${h.done?'checked':''} class="w-5 h-5 accent-emerald-500"><span class="flex-1 text-sm ${h.done?'line-through text-slate-500':''}">${esc(h.t)}</span>${h.due?`<span class="text-[11px] ${!h.done&&h.due<today()?'text-red-400':'text-slate-400'}">${h.due}</span>`:''}<button data-a="dh" data-v="${h.id}" class="text-red-400 px-1" aria-label="Delete"><i class="fa-solid fa-xmark"></i></button></div>`).join('')||'<p class="text-sm text-slate-400">No homework yet 🎉</p>');
  $('#ht').onkeydown=e=>{if(e.key=='Enter')A.addhw()}}
A.addhw=()=>{const t=$('#ht').value.trim();if(!t)return;sd(view).hw.push({id:Date.now().toString(36),t,due:$('#hd').value,done:false});save(view);pane()};
A.tg=id=>{const h=sd(view).hw.find(x=>x.id==id);h.done=!h.done;save(view);pane()};
A.dh=id=>{sd(view).hw=sd(view).hw.filter(x=>x.id!=id);save(view);pane()};

// ---------- AI ----------
const VIS=['qwen/qwen3.8-27b','qwen/qwen3.6-27b','meta-models/muse-spark-open'];
const PREF=['llama-3.3-70b-versatile','openai/gpt-oss-120b','openai/gpt-oss-20b','llama-3.1-8b-instant'];
let AV=null;
async function avail(){if(!AV?.length)try{const r=await fetch('https://api.groq.com/openai/v1/models',{headers:{Authorization:'Bearer '+GROQ}});AV=(await r.json()).data.map(x=>x.id)}catch(e){AV=[]}return AV}
async function ask(messages,json,vision){
  const av=await avail();let list=(vision?VIS:PREF).filter(m=>!av.length||av.includes(m));
  if(!list.length)list=av.filter(m=>vision?/qwen|vision|scout|maverick|muse/i.test(m):!/whisper|tts|orpheus|guard/i.test(m));
  for(const m of list){try{
    const r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+GROQ},body:JSON.stringify({model:m,messages,temperature:.5,max_tokens:vision?4000:2500,...(json?{response_format:{type:'json_object'}}:{})})});
    if(r.ok){const t=((await r.json()).choices?.[0]?.message?.content||'').replace(/<think>[\s\S]*?<\/think>/g,'').trim();if(t)return t}
  }catch(e){}}
  return null}
const sys=k=>`You are a friendly, patient school tutor for ${subj(k)[2]} (${subj(k)[1]}), helping a Cambodian high-school student. Reply in ${sd(k).lang=='en'?'English':'Khmer, keeping technical terms in English in brackets'}. Explain step by step with simple words and keep answers short.`;
const srcSel=k=>`<select id="src" class="inp"><option value="">No file (general)</option><option value="notes">My notes</option>${sd(k).files.filter(f=>f.n).map(f=>`<option value="${f.id}">${esc(f.name)}</option>`).join('')}</select>`;
async function getSrc(k,v){if(!v)return'';if(v=='notes')return sd(k).notes;const r=await getDoc(txtRef(k,v));return r.exists()?r.data().t:''}
const bub=m=>m.role=='user'?`<div class="ml-8 bg-blue-600/30 rounded-xl p-2.5 text-sm">${esc(m.content)}</div>`:`<div class="mr-8 bg-slate-900/70 rounded-xl p-2.5 text-sm md">${marked.parse(m.content.replace(/</g,'&lt;'))}</div>`;
const draw=(el,c,wait)=>{if(!el)return;el.innerHTML=c.map(bub).join('')+(wait?'<p class="text-xs text-slate-400">Thinking…</p>':'');el.scrollTop=1e9};
const shrink=f=>new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,1280/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.82))};i.src=URL.createObjectURL(f)});
function ai(){const k=view,c=chat[k]||(chat[k]=[]);IMG=null;
  $('#pane').innerHTML=`<div class="flex gap-2 mb-3">${srcSel(k)}<select id="lg" class="inp w-auto"><option value="km">ខ្មែរ</option><option value="en">English</option></select></div>
  <div id="cl" class="space-y-3 mb-3 max-h-[55vh] overflow-y-auto"><p class="text-sm text-slate-400">Ask anything, pick a file above, or tap the camera to photograph a problem.</p></div>
  <p id="pc" class="hide text-xs text-emerald-300 mb-2">📷 Photo attached · <button data-a="rmph" class="underline">remove</button></p>
  <div class="flex gap-2"><label class="btn cursor-pointer" style="background:#334155" aria-label="Photo"><i class="fa-solid fa-camera"></i><input id="ph" type="file" accept="image/*" class="hide"></label><input id="ci" class="inp" placeholder="Ask your tutor…"><button data-a="send" class="btn" aria-label="Send"><i class="fa-solid fa-paper-plane"></i></button></div>`;
  if(c.length)draw($('#cl'),c);
  $('#lg').value=sd(k).lang;$('#lg').onchange=e=>{sd(k).lang=e.target.value;save(k)};
  $('#ci').onkeydown=e=>{if(e.key=='Enter')A.send()};
  $('#ph').onchange=async e=>{const f=e.target.files[0];if(!f)return;IMG=await shrink(f);$('#pc').classList.remove('hide')}}
A.rmph=()=>{IMG=null;$('#pc').classList.add('hide')};
A.send=async()=>{const k=view,i=$('#ci'),q=i.value.trim();if(!q&&!IMG)return;
  const c=chat[k],ctx=await getSrc(k,$('#src').value),img=IMG;IMG=null;$('#pc').classList.add('hide');
  c.push({role:'user',content:(img?'📷 ':'')+(q||'Solve this problem')});i.value='';draw($('#cl'),c,true);
  const h=c.slice(-10);
  if(img)h[h.length-1]={role:'user',content:[{type:'text',text:q||'Read the problem in this photo and solve it step by step.'},{type:'image_url',image_url:{url:img}}]};
  const r=await ask([{role:'system',content:sys(k)+(ctx?`\n\nStudent's material:\n"""${ctx.slice(0,7000)}"""`:'')},...h],false,!!img);
  c.push({role:'assistant',content:r||(img?'⚠ I could not read the photo. Try a closer, clearer picture or type the question.':'⚠ The AI could not answer. Please try again in a moment.')});
  if(view==k&&tab=='ai')draw($('#cl'),c)};

// ---------- STUDY TIMER ----------
const fmt=ms=>{const t=Math.max(0,Math.round(ms/1000));return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')};
const weekMin=()=>{let t=0;for(let i=0;i<7;i++){const d=new Date(Date.now()-i*864e5).toLocaleDateString('en-CA');S.forEach(s=>t+=sd(s[0]).log?.[d]||0)}return t};
function time(){const k=view,r=TM&&TM.k==k;
  $('#pane').innerHTML=`<div class="text-center space-y-3"><p id="tc" class="text-5xl font-extrabold tabular-nums">${r?fmt(TM.end-Date.now()):'25:00'}</p>
  <div class="flex justify-center gap-2">${r?'<button data-a="tstop" class="btn" style="background:#dc2626">Stop</button>':[15,25,45].map(m=>`<button data-a="tstart" data-v="${m}" class="btn">${m} min</button>`).join('')}</div>
  <p class="text-xs text-slate-400">Today: ${sd(k).log?.[today()]||0} min here · ${weekMin()} min this week in all subjects</p></div>`}
A.tstart=m=>{if(TM)return toast('A timer is already running');TM={k:view,m:+m,end:Date.now()+m*6e4};TM.iv=setInterval(()=>{const e=TM.end-Date.now(),c=$('#tc');if(c&&view==TM.k&&tab=='time')c.textContent=fmt(e);if(e<=0)fin(true)},1000);time()};
A.tstop=()=>fin(false);
function fin(done){clearInterval(TM.iv);const k=TM.k,m=done?TM.m:Math.floor((Date.now()-(TM.end-TM.m*6e4))/6e4);TM=null;
  if(m>0){const d=sd(k);d.log=d.log||{};d.log[today()]=(d.log[today()]||0)+m;save(k)}
  navigator.vibrate?.(300);toast(done?`🎉 Session done! +${m} min`:`Stopped. +${m} min`);if(view==k&&tab=='time')time()}

// ---------- EXAM COUNTDOWN ----------
function examCard(){const ex=ME.exam,left=ex?Math.ceil((new Date(ex.date)-new Date(today()))/864e5):0;
  return `<div class="glass rounded-2xl p-4"><h3 class="font-bold text-sm mb-1"><i class="fa-solid fa-hourglass-half text-amber-400 mr-1"></i>ថ្ងៃប្រឡង · Exam countdown</h3>${ex?`<p class="text-3xl font-extrabold">${left>0?left+' days':left==0?'Today! 💪':'Finished'}</p><p class="text-xs text-slate-400">${esc(ex.name)} · ${ex.date}</p>`:'<p class="text-xs text-slate-400">Set your next exam, for example the Grade 12 national exam.</p>'}<div class="flex gap-2 mt-2"><input id="exn" class="inp" placeholder="ប្រឡងបាក់ឌុប" value="${ex?esc(ex.name):''}"><input id="exd" type="date" class="inp w-auto" value="${ex?ex.date:''}"><button data-a="exam" class="btn">Set</button></div></div>`}
A.exam=()=>{const date=$('#exd').value;if(!date)return toast('Pick the exam date');ME.exam={name:$('#exn').value.trim()||'Exam',date};setDoc(doc(db,'users',U.uid),{exam:ME.exam},{merge:true}).catch(()=>{});dash()};

// ---------- QUIZ ----------
function quiz(){const k=view,last=sd(k).scores.slice(-3).reverse();
  $('#pane').innerHTML=`<div class="space-y-2 mb-3">${srcSel(k)}<div class="flex gap-2"><input id="qt" class="inp" placeholder="Topic (optional)"><button data-a="mk" class="btn whitespace-nowrap"><i class="fa-solid fa-wand-magic-sparkles mr-1"></i>5 questions</button></div></div><div id="qz"></div>${last.length?`<p class="text-[11px] text-slate-400 mt-3">Recent scores: ${last.map(s=>`${s.s}/${s.n} (${s.d})`).join(' · ')}</p>`:''}`}
A.mk=async(_,b)=>{const k=view;b.disabled=true;$('#qz').innerHTML='<p class="text-sm text-slate-400">Writing questions…</p>';
  const ctx=await getSrc(k,$('#src').value),top=$('#qt').value.trim();
  const r=await ask([{role:'system',content:sys(k)+' Return ONLY JSON like {"questions":[{"q":"","options":["","","",""],"answer":0,"why":""}]} with exactly 5 multiple-choice questions. "answer" is the index 0-3 of the correct option.'},{role:'user',content:`Make 5 questions${top?` about: ${top}`:''}.${ctx?`\nBase them on this material:\n"""${ctx.slice(0,7000)}"""`:''}`}],true);
  b.disabled=false;let qs;try{qs=JSON.parse(r).questions.filter(x=>x.q&&x.options?.length==4)}catch(e){}
  if(!qs?.length){if($('#qz'))$('#qz').innerHTML='<p class="text-sm text-amber-300">The AI could not make a quiz. Please try again.</p>';return}
  Q={k,qs,i:0,s:0};showQ()};
function showQ(){const z=$('#qz');if(!z)return;const q=Q.qs[Q.i];
  if(!q){const n=Q.qs.length,d=sd(Q.k);d.scores=[...d.scores,{s:Q.s,n,d:today()}].slice(-20);save(Q.k);z.innerHTML=`<div class="text-center py-4"><p class="text-3xl font-extrabold">${Q.s}/${n}</p><p class="text-sm text-slate-400">Score saved ✓</p></div>`;return}
  z.innerHTML=`<p class="text-xs text-slate-400 mb-1">Question ${Q.i+1}/${Q.qs.length}</p><p class="font-semibold mb-3">${esc(q.q)}</p>`+q.options.map((o,j)=>`<button data-a="pick" data-v="${j}" class="qo w-full text-left p-2.5 mb-2 rounded-xl bg-slate-900/60 border border-slate-700 text-sm">${esc(o)}</button>`).join('')+'<div id="qw"></div>'}
A.pick=j=>{if(Q.done)return;Q.done=true;const q=Q.qs[Q.i],a=+q.answer;j=+j;if(j==a)Q.s++;
  document.querySelectorAll('.qo').forEach((e,i)=>{if(i==a)e.classList.add('!bg-emerald-600/30','!border-emerald-500');else if(i==j)e.classList.add('!bg-red-600/30','!border-red-500')});
  $('#qw').innerHTML=`<p class="text-sm text-slate-300 my-2">${esc(q.why||'')}</p><button data-a="nx" class="btn">${Q.i+1<Q.qs.length?'Next':'Finish'}</button>`};
A.nx=()=>{Q.i++;Q.done=false;showQ()};
</script>
</body>
