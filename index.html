async function getRel(k,q,max=8000,tag='',only=''){
  await readPending(k,only);
  const d=sd(k),docs=[];
  if(!only&&d.notes.trim())docs.push(['កំណត់ត្រា',d.notes.slice(0,6000)]);
  for(const f of d.files.filter(f=>rd(f)&&(!tag||f.tag==tag)&&(!only||f.id==only)).slice(-25)){try{let t=TXT[f.id];if(t==null){const r=await getDoc(txtRef(k,f.id));t=TXT[f.id]=r.exists()?r.data().t:''}if(t)docs.push([f.tag+': '+f.name,t])}catch(e){}}

  const g=x=>{const a=x.replace(/\s+/g,'').toLowerCase(),m=new Set;for(let i=0;i<a.length-2;i++)m.add(a.slice(i,i+3));return m},qs=g(q||'');
  ch.forEach(c=>{if(!qs.size){c.s=Math.random()-c.i/1e5;return}let n=0;g(c.t).forEach(x=>{if(qs.has(x))n++});c.s=n});

async function genMany(...a){SPEED=1;try{return await genMany0(...a)}finally{SPEED=0}}
async function genMany0(total,label,mk,key){
  const out=[];let fail=0;
  while(out.length<total&&fail<2){
    prog(label+' '+out.length+'/'+total+'…');
    const part=await mk(Math.min(8,total-out.length),out.slice(-40).map(x=>x[key]));
    const fresh=part.filter(x=>!out.some(y=>y[key]==x[key]));
    if(!fresh.length){fail++;continue}
    fail=0;out.push(...fresh);
  }
  return out.slice(0,total);
}

const chunkT=(t,n)=>{const o=[];let c='';for(const w of t.split(' ')){if(w.length>n){if(c){o.push(c);c=''}for(let i=0;i<w.length;i+=n)o.push(w.slice(i,i+n));continue}if((c+' '+w).length>n){o.push(c);c=w}else c=(c+' '+w).trim()}if(c)o.push(c);return o};
async function speakAll(text){

  const a=TTSA||(TTSA=new Audio());try{a.pause()}catch(e){}a.src=SIL;a.play().catch(()=>{});
  const segs=[];(text.replace(/[ \t]+/g,' ').match(/[^.!?។\n]+[.!?។]*/g)||[text]).forEach(x=>{x=x.trim();if(!x)return;const l=(x.match(/[A-Za-z]/g)||[]).length/Math.max(1,x.replace(/\s/g,'').length)>.5?'en':'km',last=segs[segs.length-1];if(last&&last.l==l&&last.t.length+x.length<170)last.t+=' '+x;else segs.push({l,t:x})});
    for(const s of segs)for(const part of chunkT(s.t,s.l=='en'?185:180)){

  }
}

    <div class="flex gap-2"><input id="qn" type="number" min="1" value="10" class="inp" style="max-width:120px" placeholder="ចំនួនសំណួរ" title="ចំនួនសំណួរ"><select id="ql" class="inp"><option value="easy">កម្រិតងាយ</option><option value="medium" selected>កម្រិតមធ្យម</option><option value="hard">កម្រិតពិបាក (បាក់ឌុប)</option></select></div>
  </div>
  <div id="qz"></div>
  ${last.length?`<p class="text-xs text-slate-400 mt-3">ពិន្ទុថ្មីៗ៖ ${last.map(s=>`${s.s}/${s.n} (${s.d})`).join(' · ')}</p>`:''}`;
}
A.mk=async(_,b)=>{
  const k=view,N=Math.max(1,Math.floor(+$('#qn').value||10)),LV=$('#ql').value;if(N>60&&!confirm('សំណួរ '+N+' ត្រូវប្រើពេលយូរ។ បន្តឬ?'))return;
  b.disabled=true;$('#qz').innerHTML='<p class="text-sm text-slate-400">កំពុងបង្កើតសំណួរតេស្ត…</p>';
  const top=$('#qt').value.trim(),ctx=await getSrc(k,$('#src').value,top);
  const qs=await genMany(N,'កំពុងបង្កើតសំណួរ',async(n,prev)=>{
    const r=await ask([{role:'system',content:sys(k)+' Output ONLY '+n+' '+LV+' multiple-choice questions in this exact plain-text format, each separated by a line containing only ---. No JSON, no code fences.\nQ: <question>\nA) <option>\nB) <option>\nC) <option>\nD) <option>\nANSWER: <A, B, C or D>\nWHY: <short explanation>\nSolve every question yourself first and double-check that the marked answer is really correct. Exactly one option is correct and the options must be different. '+(SCI.has(k)?MATHF+' ':'')+LQ(k)+(prev.length?' Do NOT repeat these questions: '+prev.join(' | ').slice(0,1500)+'.':'')},{role:'user',content:`Make ${n} questions${top?` about: ${top}`:''}.${ctx?`\nBase them on:\n"""${ctx.slice(0,5200)}"""`:''}`}],false,false,t=>parseQuiz(t,k).length>0);
    return await verifyQuiz(k,parseQuiz(r,k));
  },'q');
  b.disabled=false;
  if(!qs.length){if($('#qz'))$('#qz').innerHTML='<p class="text-sm text-amber-300">មិនអាចបង្កើតសំណួរបានទេ '+esc(ERR||'សូមព្យាយាមម្តងទៀត')+'</p>';return}
  Q={k,qs,i:0,s:0};showQ();
};
function showQ(){
  const z=$('#qz');if(!z)return;const q=Q.qs[Q.i];
  if(!q){const n=Q.qs.length,d=sd(Q.k);d.scores=[...d.scores,{s:Q.s,n,d:today()}].slice(-20);save(Q.k);z.innerHTML=`<div class="text-center py-5"><p class="text-4xl font-extrabold text-emerald-400">${Q.s}/${n}</p><p class="text-sm text-slate-400 mt-1">បានរក្សាទុកពិន្ទុ ✓</p></div>`;return}
  z.innerHTML=`<p class="text-xs text-slate-400 mb-1">សំណួរទី ${Q.i+1}/${Q.qs.length}</p><p class="font-semibold mb-3">${esc(q.q)}</p>`+q.options.map((o,j)=>`<button data-a="pick" data-v="${j}" class="qo w-full text-left p-3 mb-2 rounded-xl glass-soft text-sm transition">${esc(o)}</button>`).join('')+'<div id="qw"></div>';rm(z);
}
A.pick=j=>{
  if(Q.done)return;Q.done=true;const q=Q.qs[Q.i],a=+q.answer;j=+j;if(j==a){Q.s++;if(Q.retry){const d=sd(Q.k);d.mist=(d.mist||[]).filter(x=>x.q!=q.q);save(Q.k)}}else if(!Q.retry){const d=sd(Q.k);(d.cards=d.cards||[]).push({f:q.q,b:q.options[a],box:1,due:today()});(d.mist=d.mist||[]).push({i:Date.now().toString(36),q:q.q,o:q.options,a,m:j,d:today()});d.mist=d.mist.slice(-100)}
  document.querySelectorAll('.qo').forEach((e,i)=>{if(i==a)e.classList.add('!bg-emerald-600/30','!border-emerald-500');else if(i==j)e.classList.add('!bg-red-600/30','!border-red-500')});
  $('#qw').innerHTML=`<p class="text-sm text-slate-300 my-2.5 p-3 rounded-xl bg-slate-900/60">${esc(q.why||'')}</p><button data-a="nx" class="btn w-full">${Q.i+1<Q.qs.length?'សំណួរបន្ទាប់ →':'មើលលទ្ធផល'}</button>`;rm($('#qw'));
};
A.nx=()=>{Q.i++;Q.done=false;showQ()};
</script>
