async function streak(){
  const r=doc(db,'users',U.uid),s=(await getDoc(r)).data()||{},t=today(),y=new Date(Date.now()-864e5).toLocaleDateString('en-CA');
  if(s.last!==t){s.streak=s.last===y?(s.streak||0)+1:1;s.best=Math.max(s.best||0,s.streak);s.last=t;await setDoc(r,s,{merge:true}).catch(()=>{})}

}

const ENKH=/[ក-៿]/;
function trE(t){
  const lead=t.match(/^\s*/)[0],trail=t.match(/\s*$/)[0],n=t.trim().replace(/\s+/g,' ');
  if(!n||!ENKH.test(n))return t;
  let r=ENUI[n];
  if(r===undefined){let m=n;for(const [re,f] of ENPAT)m=m.replace(re,f);if(m!==n)r=m}
  return r===undefined?t:lead+r+trail;
}
const ENSCOPE='#main,#fv,#xo,#toast';
function enApply(root){
  if(view!='eng'||!root||root.nodeType!=1)return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),ns=[];let n;
  while(n=w.nextNode())if(ENKH.test(n.nodeValue))ns.push(n);
  ns.forEach(x=>{const v=trE(x.nodeValue);if(v!==x.nodeValue)x.nodeValue=v});
  const el=[...root.querySelectorAll('[placeholder],[title],[aria-label],optgroup[label]')];if(root.matches('[placeholder],[title],[aria-label],optgroup[label]'))el.push(root);
  el.forEach(e=>{for(const a of ['placeholder','title','aria-label','label']){const v=e.getAttribute(a);if(v&&ENKH.test(v)){const t=trE(v);if(t!==v)e.setAttribute(a,t)}}});
}
new MutationObserver(ms=>{
  if(view!='eng')return;
  for(const m of ms)m.addedNodes.forEach(nd=>{
    if(nd.nodeType==3){const p=nd.parentElement;if(p&&p.closest(ENSCOPE)&&ENKH.test(nd.nodeValue)){const v=trE(nd.nodeValue);if(v!==nd.nodeValue)nd.nodeValue=v}}
    else if(nd.nodeType==1&&(nd.closest(ENSCOPE)))enApply(nd);
  });
}).observe(document.body,{childList:true,subtree:true});

const WCATS=['Verb tense','Subject-verb agreement','Articles','Prepositions','Spelling','Punctuation','Word choice','Word order','Plurals','Other'];
function extractWM(r){
  let items=[];const m=String(r).match(/<mistakes>([\s\S]*?)(?:<\/mistakes>|$)/i);
  if(m){try{const j=JSON.parse(m[1].replace(/^\s*```(?:json)?/i,'').replace(/```\s*$/,'').trim());if(Array.isArray(j))items=j}catch(e){}}
  return{text:String(r).replace(/<mistakes>[\s\S]*?(?:<\/mistakes>|$)/gi,'').trim(),items};
}
function addWM(items){
  const d=sd('eng'),L=d.wm||(d.wm=[]);let n=0;
  for(const x of items.slice(0,12)){
    if(!x||typeof x!='object')continue;
    const bad=String(x.bad||'').trim().slice(0,160),good=String(x.good||'').trim().slice(0,160);
    if(!bad||!good||bad.toLowerCase()==good.toLowerCase())continue;
    const cat=WCATS.find(c=>c.toLowerCase()==String(x.cat||'').trim().toLowerCase())||'Other',rule=String(x.rule||'').trim().slice(0,220);
    const f=L.find(y=>y.bad.toLowerCase()==bad.toLowerCase()&&y.good.toLowerCase()==good.toLowerCase());
    if(f){f.n=(f.n||1)+1;f.ts=Date.now();if(rule)f.rule=rule}
    else{L.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),bad,good,cat,rule,n:1,ts:Date.now()});n++}
  }
  if(L.length>300)d.wm=L.slice(-300);
  save('eng');return n;
}

const SUPS={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','+':'⁺','-':'⁻','n':'ⁿ'},SUBS={'0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉','+':'₊','-':'₋'};
const TEXSYM={times:' × ',cdot:' · ',pi:'π',Delta:'Δ',delta:'δ',alpha:'α',beta:'β',gamma:'γ',theta:'θ',lambda:'λ',mu:'μ',omega:'ω',Omega:'Ω',sigma:'σ',Sigma:'Σ',rho:'ρ',epsilon:'ε',varepsilon:'ε',phi:'φ',rightarrow:' → ',to:' → ',Rightarrow:' ⇒ ',leftrightarrow:' ↔ ',rightleftharpoons:' ⇌ ',leq:' ≤ ',le:' ≤ ',geq:' ≥ ',ge:' ≥ ',neq:' ≠ ',approx:' ≈ ',pm:' ± ',infty:'∞',circ:'°',degree:'°',cdots:'…',ldots:'…',int:'∫',sum:'Σ',left:'',right:'',quad:' ',qquad:'  '},TEXFN=new Set(['log','ln','sin','cos','tan','cot','exp','lim','max','min']);
function texToText(x){
  let s=String(x);
  for(let i=0;i<3;i++)s=s.replace(/\\d?frac\s*\{([^{}]*)\}\s*\{([^{}]*)\}/g,'($1)/($2)').replace(/\\sqrt\s*\{([^{}]*)\}/g,'√($1)').replace(/\\(?:mathrm|text|mathbf|textbf|operatorname)\s*\{([^{}]*)\}/g,'$1');
  s=s.replace(/\\([A-Za-z]+)( ?)/g,(m,n,sp)=>n in TEXSYM?TEXSYM[n]:TEXFN.has(n)?n+(sp||''):m);
  s=s.replace(/\^\{([^{}]*)\}/g,(m,a)=>[...a].every(c=>SUPS[c])?[...a].map(c=>SUPS[c]).join(''):'^('+a+')').replace(/\^([0-9n+-])/g,(m,a)=>SUPS[a]||m);
  s=s.replace(/_\{([^{}]*)\}/g,(m,a)=>[...a].every(c=>SUBS[c])?[...a].map(c=>SUBS[c]).join(''):'_('+a+')').replace(/_([0-9])/g,(m,a)=>SUBS[a]);
  return s.replace(/\\\\/g,' ').replace(/\\[,;!: ]/g,' ').replace(/[{}]/g,'').replace(/\s+/g,' ').trim();
}
function plainText(md0){
  let t=String(md0||'');
  t=t.replace(/\$\$([\s\S]+?)\$\$/g,(m,a)=>texToText(a)).replace(/\$([^$\n]+?)\$/g,(m,a)=>texToText(a)).replace(/\\\(([\s\S]+?)\\\)/g,(m,a)=>texToText(a)).replace(/\\\[([\s\S]+?)\\\]/g,(m,a)=>texToText(a));
  return t.split('\n').filter(l=>!/^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l)).join('\n')
    .replace(/^[ \t]*#{1,6}[ \t]*/gm,'').replace(/\*\*(.+?)\*\*/g,'$1').replace(/__(.+?)__/g,'$1').replace(/`([^`\n]+)`/g,'$1')
    .replace(/^[ \t]*>[ \t]?/gm,'').replace(/^[ \t]*[-*+][ \t]+/gm,'• ').replace(/^[ \t]*\|[ \t]*/gm,'').replace(/[ \t]*\|[ \t]*$/gm,'').replace(/[ \t]*\|[ \t]*/g,' | ')
    .replace(/\n{3,}/g,'\n\n').trim();
}

function cleanPhoto(u){return new Promise(ok=>{const i=new Image();i.onerror=()=>ok(u);i.onload=()=>{
  try{const c=document.createElement('canvas');c.width=i.width;c.height=i.height;const x=c.getContext('2d');x.drawImage(i,0,0);
  const im=x.getImageData(0,0,c.width,c.height),d=im.data,n=c.width*c.height,h=new Uint32Array(256);
  for(let p=0;p<d.length;p+=4){const g=(d[p]*.299+d[p+1]*.587+d[p+2]*.114)|0;d[p]=g;h[g]++}
  let lo=0,hi=255,a=0;for(let v=0;v<256;v++){a+=h[v];if(a>=n*.01){lo=v;break}}a=0;for(let v=0;v<256;v++){a+=h[v];if(a>=n*.7){hi=v;break}}
  if(hi-lo<30){hi=Math.min(255,lo+30)}
  const lut=new Uint8Array(256);for(let v=0;v<256;v++){let t=Math.min(1,Math.max(0,(v-lo)/(hi-lo)));t=t*t*(3-2*t);lut[v]=Math.round(t*255)}
  for(let p=0;p<d.length;p+=4){const g=lut[d[p]];d[p]=d[p+1]=d[p+2]=g}
  x.putImageData(im,0,0);ok(c.toDataURL('image/jpeg',.85))}catch(e){ok(u)}};i.src=u})}

async function genMany(...a){SPEED=1;try{return await genMany0(...a)}finally{SPEED=0}}
async function genMany0(total,label,mk,key){
  // The free AI returns only a few items per request and rests when it is busy. So: several batches in parallel (each starts on a different
  // model), duplicates removed, and the missing ones are asked for again — waiting for the AI when it says "busy" — until the number is reached.
  const out=[],seen=new Set(),norm=x=>String(x).toLowerCase().replace(/[\s.,;:!?()\[\]{}"'“”‘’។៕\-–—_*$\\]+/g,'').slice(0,70),t0=Date.now();
  let fails=0,round=0;
  while(out.length<total&&fails<4&&Date.now()-t0<420000){
    const need=total-out.length,nb=Math.min(3,Math.ceil(need/8)),per=Math.min(9,Math.ceil(need*1.08/nb)),prev=out.slice(-40).map(x=>x[key]);
    prog(label+' '+out.length+'/'+total+(fails?' · ព្យាយាមម្តងទៀត':'')+'…');
    const res=await Promise.all(Array.from({length:nb},(_,i)=>mk(per,prev,{rot:round*nb+i,part:i,of:nb}).catch(()=>[])));
    let got=0;
    for(const part of res)for(const x of part||[]){const nk=norm(x[key]);if(!nk||seen.has(nk))continue;seen.add(nk);out.push(x);got++}
    if(got)fails=0;else{fails++;await new Promise(r=>setTimeout(r,1500*fails))}
    round++;
  }
  endProg();return out.slice(0,total);
}

  const k=view;if(needNet())return;if(GENQ[k]&&Date.now()-GENQ[k]<6e5)return toast('កំពុងបង្កើតសំណួរ… សូមរង់ចាំបន្តិច');
  const N=Math.max(1,Math.floor(+$('#qn').value||10)),LV=$('#ql').value;if(N>60&&!confirm('សំណួរ '+N+' ត្រូវប្រើពេលយូរ។ បន្តឬ?'))return;
  GENQ[k]=Date.now();QOPT[k]={t:$('#qt').value,n:$('#qn').value,l:LV};
  b.disabled=true;$('#qz').innerHTML='<p class="text-sm text-slate-400">កំពុងបង្កើតសំណួរតេស្ត… អ្នកអាចទៅផ្ទាំងផ្សេងបាន សំណួរនឹងរង់ចាំអ្នក</p>';
  const top=$('#qt').value.trim(),src=$('#src').value,ctx=await getSrc(k,src,top);
  const qs=await genMany(N,'កំពុងបង្កើតសំណួរ',async(n,prev,o)=>{
    const cx=o.rot&&!top?await getSrc(k,src,top):ctx; // no topic: every batch looks at a different part of the files
    const r=await ask([{role:'system',content:sys(k)+' Output ONLY '+n+' '+LV+' multiple-choice questions in this exact plain-text format, each separated by a line containing only ---. No JSON, no code fences.\nQ: <question>\nA) <option>\nB) <option>\nC) <option>\nD) <option>\nANSWER: <A, B, C or D>\nWHY: <short explanation>\nReplace each <…> with real text — never write the < > symbols. Write only Khmer and English, never Thai or Lao.\nSolve every question yourself first and double-check that the marked answer is really correct. Exactly one option is correct and the options must be different. '+(SCI.has(k)?MATHF+' ':'')+LQ(k)+(prev.length?' Do NOT repeat these questions: '+prev.join(' | ').slice(0,1500)+'.':'')},{role:'user',content:`Make ${n} questions${top?` about: ${top}`:''}.${o.of>1?` (This is part ${o.part+1} of ${o.of}: cover different points from the other parts.)`:''}${cx?`\nBase them on:\n"""${cx.slice(0,5200)}"""`:''}`}],false,false,t=>parseQuiz(t,k).length>0,undefined,{rot:o.rot,mt:1400+n*330,effort:'medium'});
    return await verifyQuiz(k,parseQuiz(r,k));
  },'q');
  b.disabled=false;GENQ[k]=0;const here=view==k&&tab=='quiz'&&$('#qz');
  if(!qs.length){if(here)$('#qz').innerHTML='<p class="text-sm text-amber-300">មិនអាចបង្កើតសំណួរបានទេ '+esc(ERR||'សូមព្យាយាមម្តងទៀត')+'</p>';else toast('មិនអាចបង្កើតសំណួរបានទេ — សូមព្យាយាមម្តងទៀត');return}
  setQ({k,qs,i:0,s:0});if(here)showQ();else toast('✅ សំណួររួចរាល់ — បើកផ្ទាំង «សំណួរ» ដើម្បីធ្វើ');
  if(qs.length<N)toastL('⚠ បានតែ '+qs.length+'/'+N+' សំណួរ — AI ឥតគិតថ្លៃរវល់/អស់កូតា ('+(ERR?ERR.slice(0,70):'ឆ្លើយមិនគ្រប់')+') · ចុចបង្កើតម្តងទៀតដើម្បីបន្ថែម');
};
function showQ(){
  const z=$('#qz');if(!z||!Q||Q.k!==view)return;const q=Q.qs[Q.i];
  if(!q){
    const n=Q.qs.length;
    if(!Q.fin){Q.fin=1;const d=sd(Q.k);d.scores=[...d.scores,{s:Q.s,n,d:today()}].slice(-20);save(Q.k);qSave(Q.k)}
    z.innerHTML=`<div class="text-center py-5"><p class="text-4xl font-extrabold text-emerald-400">${Q.s}/${n}</p><p class="text-sm text-slate-400 mt-1">បានរក្សាទុកពិន្ទុ ✓</p><button data-a="qclear" class="btn btn-sec mt-3">សំណួរថ្មី</button></div>`;return}
  z.innerHTML=`<p class="text-xs text-slate-400 mb-1 flex justify-between"><span>សំណួរទី ${Q.i+1}/${Q.qs.length}</span><button data-a="qclear" class="underline">លុបសំណួរនេះ</button></p><p class="font-semibold mb-3">${esc(q.q)}</p>`+q.options.map((o,j)=>`<button data-a="pick" data-v="${j}" class="qo w-full text-left p-3 mb-2 rounded-xl glass-soft text-sm transition">${esc(o)}</button>`).join('')+'<div id="qw"></div>';rm(z);
  if(Q.done&&Q.pk!=null)revealQ();
}
function revealQ(){
  const q=Q.qs[Q.i],a=+q.answer;
  document.querySelectorAll('.qo').forEach((e,i)=>{if(i==a)e.classList.add('!bg-emerald-600/30','!border-emerald-500');else if(i==Q.pk)e.classList.add('!bg-red-600/30','!border-red-500')});
  $('#qw').innerHTML=`<p class="text-sm text-slate-300 my-2.5 p-3 rounded-xl bg-slate-900/60">${esc(q.why||'')}</p><button data-a="nx" class="btn w-full">${Q.i+1<Q.qs.length?'សំណួរបន្ទាប់ →':'មើលលទ្ធផល'}</button>`;rm($('#qw'));
}
A.pick=j=>{
  if(Q.done)return;Q.done=true;const q=Q.qs[Q.i],a=+q.answer;j=+j;Q.pk=j;
  if(j==a){Q.s++;if(Q.retry){const d=sd(Q.k);d.mist=(d.mist||[]).filter(x=>x.q!=q.q);save(Q.k)}}else if(!Q.retry){const d=sd(Q.k);(d.cards=d.cards||[]).push({f:q.q,b:q.options[a],box:1,due:today()});(d.mist=d.mist||[]).push({i:Date.now().toString(36),q:q.q,o:q.options,a,m:j,d:today()});d.mist=d.mist.slice(-100);save(Q.k)}
  qSave(Q.k);revealQ();
};
A.nx=()=>{Q.i++;Q.done=false;Q.pk=null;qSave(Q.k);showQ()};
A.qclear=()=>{const k=view;QSES[k]=null;qSave(k);Q=null;quiz()};
</script>
