async function extract(f){
  const n=f.name.toLowerCase();
  if(n.endsWith('.pdf')){const p=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let t='';for(let i=1;i<=p.numPages;i++)t+=(await(await p.getPage(i)).getTextContent()).items.map(x=>x.str).join(' ')+'\n';return t}
  if(n.endsWith('.docx'))return (await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()})).value;
  if(/\.(txt|md)$/.test(n))return f.text();
  if(f.type.startsWith('image/'))return await ask([{role:'user',content:[{type:'text',text:'Extract all the text in this image exactly as written (Khmer and English). Write maths in plain text. Return only the text.'},{type:'image_url',image_url:{url:await shrink(f,1500)}}]}],false,true)||'';
  return '';
}
async function upload(e){
  const k=view,d=sd(k),tag=$('#tag').value;toast('កំពុងអានឯកសារ…');
  for(const f of e.target.files){try{
    const t=(await extract(f)).trim().slice(0,200000),id=Date.now().toString(36)+Math.random().toString(36).slice(2,5);
    await idbPut(id,f);if(t)await setDoc(txtRef(k,id),{t});
    d.files.push({id,name:f.name,tag,d:today(),n:t.length});
  }catch(x){toast('មិនអាចអាន '+f.name)}}
  await save(k);if(view==k&&tab=='files')pane();toast('បានរក្សាទុក ✓');
}

async function avail(){

async function oaCall(u,k,m,messages,json,vision){
  const body={model:m,messages,temperature:.35,max_tokens:vision?3500:3000};
  if(json&&u==GQ)body.response_format={type:'json_object'};
  const r=await tf(u,{method:'POST',headers:{'Content-Type':'application/json',...(k?{Authorization:'Bearer '+k}:{})},body:JSON.stringify(body)},u==PL?35000:25000);
  if(!r.ok){let j={};try{j=await r.json()}catch(e){}throw new Error(r.status+' '+(j.error?.message||j.message||'').slice(0,95))}
  const data=await r.json();
  return data.choices?.[0]?.message?.content||'';
}

async function ask(messages,json,vision,check){
  messages=messages.map(m=>({role:m.role,content:m.content}));
  ERR='';const t0=Date.now(),LOG=[],dead=new Set(),L=[];
  const gKeys=kl('groq');
  if(gKeys.length){
    const av=await avail();
    let models=[];
    if(vision){
      models=VIS.filter(m=>!av.length||av.includes(m));
      if(av.length)models=[...new Set([...models,...av.filter(m=>/vision|scout|maverick|llava/i.test(m))])];
      if(!models.length)models=VIS;
    }else{
      models=PREF.filter(m=>av.includes(m));
      if(av.length)models=[...new Set([...models,...av])];
      if(!models.length)models=['llama-3.1-8b-instant','llama-3.3-70b-versatile'];
    }
    models.slice(0,4).forEach(m=>shuf(gKeys).slice(0,3).forEach(k=>L.push({m,u:GQ,k})));
  }
  const orKeys=kl('openrouter');
  if(!vision&&orKeys.length){
    const oms=await orList();
    oms.slice(0,4).forEach(m=>L.push({m,u:OR,k:orKeys[0]}));
  }
  if(!vision){
    L.push({m:'openai',u:PL,k:''});
    L.push({m:'openai-fast',u:PL,k:''});
  }
  for(const x of L){
    const dk=x.u+'|'+x.k;if(dead.has(dk))continue;if(Date.now()-t0>55000)break;
    try{
      let t=await oaCall(x.u,x.k,x.m,messages,json,vision);
      t=(t||'').replace(/<think>[\s\S]*?<\/think>/g,'').trim();
      if(!t)throw new Error('គ្មានចម្លើយ');
      if(check&&!check(t))throw new Error('ទម្រង់មិនត្រឹមត្រូវ');
      WHO=(x.u==GQ?'Groq':x.u==OR?'OpenRouter':'AI បម្រុងឥតគិតថ្លៃ')+' · '+x.m.split('/').pop();
      return t;
    }catch(e){
      const m=e.name=='AbortError'?'អស់ពេលរង់ចាំ':e.message||'កំហុសបណ្តាញ';
      LOG.push(x.m.split('/').pop()+' → '+m);
      if(/\b(401|403)\b|invalid_api_key|unauthor/i.test(m))dead.add(dk);
    }
  }
  ERR=LOG.slice(-2).join(' | ')||'សូមពិនិត្យអ៊ីនធឺណិត ឬបន្ថែមកូនសោ Groq';
  return null;
}

  $('#main').innerHTML=`<div class="max-w-md mx-auto space-y-4">

        <label class="text-xs text-blue-300 cursor-pointer hover:underline">ប្តូររូបថតប្រវត្តិរូប<input id="pph" type="file" accept="image/*" class="hide"></label>
      </div>
      <label class="block text-xs text-slate-400">ឈ្មោះរបស់អ្នក<input id="pn" class="inp mt-1" maxlength="30" placeholder="ឧ. សារ៉ែន សិរីបុញ្ញវឌ្ឍក៍" value="${esc(p.name||'')}"></label>
      <div class="grid grid-cols-2 gap-2.5">
        <label class="block text-xs text-slate-400">ភាសាឆ្លើយតប AI<select id="pl" class="inp mt-1"><option value="km">ភាសាខ្មែរ</option><option value="en">English</option></select></label>
        <label class="block text-xs text-slate-400">គោលដៅប្រចាំថ្ងៃ<select id="pgl" class="inp mt-1">${[30,60,90,120].map(m=>`<option value="${m}">${m} នាទី/ថ្ងៃ</option>`).join("")}</select></label>
      </div>

      <div class="glass-soft p-3.5 space-y-2.5">
        <div class="flex items-center justify-between">
          <span class="font-bold text-xs text-blue-300"><i class="fa-solid fa-key mr-1"></i>កូនសោ AI ឥតគិតថ្លៃ ១០០% (មិនត្រូវការកាត)</span>
        </div>
        <div class="text-xs text-slate-300 space-y-1.5 leading-relaxed bg-slate-900/60 p-2.5 rounded-xl">
          <p><b>១. Groq (លឿនបំផុត និងណែនាំឱ្យប្រើ)៖</b> បើក <a class="underline text-blue-300 font-medium" href="https://console.groq.com/keys" target="_blank" rel="noopener">console.groq.com/keys</a> → ចូលដោយ Google → ចុច <b>Create API Key</b> → ចម្លងកូនសោដែលផ្តើមដោយ <code>gsk_...</code> មកដាក់ខាងក្រោម។</p>
          <p><b>២. OpenRouter (បម្រុងឥតគិតថ្លៃ)៖</b> បើក <a class="underline text-blue-300 font-medium" href="https://openrouter.ai/keys" target="_blank" rel="noopener">openrouter.ai/keys</a> → បង្កើតកូនសោដែលផ្តើមដោយ <code>sk-or-...</code>។</p>
          <p class="text-emerald-300 text-[11px]">💡 អាចដាក់ច្រើនកូនសោក្នុងប្រអប់តែមួយ ដោយខណ្ឌដោយសញ្ញាក្បៀស (,) ដើម្បីឱ្យប្រព័ន្ធប្តូរដោយស្វ័យប្រវត្តិ។</p>
        </div>
        <label class="block text-xs text-slate-400">កូនសោ Groq (ផ្តើមដោយ gsk_...)<input id="pk-groq" class="inp mt-1 font-mono text-xs" placeholder="gsk_..." value="${esc(own('groq'))}"></label>
        <label class="block text-xs text-slate-400">កូនសោ OpenRouter (ផ្តើមដោយ sk-or-...)<input id="pk-openrouter" class="inp mt-1 font-mono text-xs" placeholder="sk-or-v1-..." value="${esc(own('openrouter'))}"></label>
        <div class="grid grid-cols-2 gap-2 pt-1">
          <button data-a="testai" class="btn btn-sec text-xs"><i class="fa-solid fa-heart-pulse text-emerald-400"></i>សាកល្បង AI</button>
          <button data-a="sharekeys" class="btn btn-sec text-xs"><i class="fa-solid fa-share-nodes text-blue-400"></i>ចែករំលែកក្នុងថ្នាក់</button>
        </div>
      </div>

      <button data-a="psave" class="btn w-full"><i class="fa-solid fa-floppy-disk"></i>រក្សាទុកការកំណត់</button>

      <div class="pt-2 border-t border-slate-800 space-y-2">
        <div class="flex items-center justify-between text-xs text-slate-400"><span class="truncate">${esc(U.email)}</span><button data-a="cpid" class="text-blue-300 hover:underline whitespace-nowrap"><i class="fa-solid fa-copy mr-1"></i>ចម្លង ID (${U.uid.slice(0,6)}…)</button></div>
        <div class="grid grid-cols-2 gap-2">
          <button data-a="share" class="btn btn-sec text-xs"><i class="fa-solid fa-user-plus"></i>អញ្ជើញមិត្តភក្តិ</button>
          <button data-a="inst" class="btn btn-sec text-xs"><i class="fa-solid fa-mobile-screen"></i>ដំឡើងកម្មវិធី</button>
        </div>
        <div class="flex justify-between text-xs text-blue-300 pt-1">
          <button data-a="export" class="hover:underline">ទាញយកទិន្នន័យទុក (Backup)</button>
          <button data-a="preset" class="hover:underline">ប្តូរពាក្យសម្ងាត់</button>
        </div>
      </div>
    </div>
    <div class="glass p-5 space-y-3">${statsHTML()}</div>
  </div>`;
  $('#pl').value=p.lang||'km';$('#pgl').value=p.goal||60;
  $('#pph').onchange=async e=>{const f=e.target.files[0];if(!f)return;PAV=await shrink(f,256);$('#pav').innerHTML=avatar(84,{avatar:PAV})};
}

A.psave=async()=>{
  saveKeysLocal();
  const old=ME.profile||{},pf={name:$('#pn').value.trim(),grade:CLASS,lang:$('#pl').value,goal:+$('#pgl').value,avatar:PAV};
  ME.profile=pf;
  await setDoc(doc(db,'users',U.uid),{profile:pf},{merge:true}).catch(e=>toast('រក្សាទុកមិនបាន៖ '+e.code));
  if(pf.lang!=(old.lang||'km'))S.forEach(s=>{sd(s[0]).lang=pf.lang;save(s[0])});
  syncPub();pbtn();toast('បានរក្សាទុកការកំណត់ ✓');
};
A.preset=async()=>{try{await fp(auth,U.email);toast('បានផ្ញើអ៊ីមែលកំណត់ពាក្យសម្ងាត់ថ្មី។')}catch(e){toast('មិនអាចផ្ញើអ៊ីមែលបានទេ')}};

// ---------- TIMER + AMBIENT FOCUS SOUND ----------
const fmt=ms=>{const t=Math.max(0,Math.round(ms/1000));return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')};
const weekMin=()=>{let t=0;for(let i=0;i<7;i++){const d=new Date(Date.now()-i*864e5).toLocaleDateString('en-CA');S.forEach(s=>t+=sd(s[0]).log?.[d]||0)}return t};

function toggleRain(){
  if(RAIN){RAIN.ctx.close();RAIN=null;if(tab=='time')time();return}
  const AudioCtx=window.AudioContext||window.webkitAudioContext;
  if(!AudioCtx)return toast('ឧបករណ៍មិនគាំទ្រសំឡេងនេះទេ');
  const ctx=new AudioCtx(),buf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate),out=buf.getChannelData(0);
  let last=0;
  for(let i=0;i<out.length;i++){const w=Math.random()*2-1;out[i]=(last+(0.02*w))/1.02;last=out[i];out[i]*=0.18}
  const src=ctx.createBufferSource();src.buffer=buf;src.loop=true;
  const flt=ctx.createBiquadFilter();flt.type='lowpass';flt.frequency.value=650;
  src.connect(flt);flt.connect(ctx.destination);src.start();
  RAIN={ctx};if(tab=='time')time();
}
A.rain=toggleRain;

function time(){
  const k=view,r=TM&&TM.k==k;
  $('#pane').innerHTML=`<div class="text-center py-4 space-y-4">
    <p class="text-xs text-slate-400 uppercase tracking-wider">ម៉ោងសិក្សាផ្តោតអារម្មណ៍ (Pomodoro)</p>
    <p id="tc" class="text-6xl font-extrabold tabular-nums tracking-tight text-blue-400">${r?fmt(TM.end-Date.now()):'25:00'}</p>
    <div class="flex justify-center gap-2 flex-wrap">
      ${r?'<button data-a="tstop" class="btn" style="background:#dc2626"><i class="fa-solid fa-stop"></i>បញ្ឈប់</button>':[15,25,45,60].map(m=>`<button data-a="tstart" data-v="${m}" class="btn">${m} នាទី</button>`).join('')}
    </div>
    <div class="pt-2">
      <button data-a="rain" class="chip ${RAIN?'bg-blue-500/25 border-blue-400 text-blue-200':''}"><i class="fa-solid fa-cloud-rain mr-1.5"></i>${RAIN?'កំពុងបើកសំឡេងភ្លៀងស្រទន់ (ចុចបិទ)':'បើកសំឡេងភ្លៀងពេលរៀន (Focus Sound)'}</button>
    </div>
    <p class="text-xs text-slate-400">ថ្ងៃនេះ៖ ${sd(k).log?.[today()]||0} នាទីក្នុងមុខវិជ្ជានេះ · សប្តាហ៍នេះសរុប ${weekMin()} នាទី</p>
  </div>`;
}
A.tstart=m=>{if(TM)return toast('កំពុងមានម៉ោងរាប់ថយក្រោយរួចហើយ');TM={k:view,m:+m,end:Date.now()+m*6e4};TM.iv=setInterval(()=>{const e=TM.end-Date.now(),c=$('#tc');if(c&&view==TM.k&&tab=='time')c.textContent=fmt(e);if(e<=0)fin(true)},1000);time()};
A.tstop=()=>fin(false);
function fin(done){
  clearInterval(TM.iv);const k=TM.k,m=done?TM.m:Math.floor((Date.now()-(TM.end-TM.m*6e4))/6e4);TM=null;
  if(m>0){const d=sd(k);d.log=d.log||{};d.log[today()]=(d.log[today()]||0)+m;save(k);syncPub()}
  navigator.vibrate?.(300);toast(done?`🎉 រៀនចប់ហើយ! +${m} នាទី`:`បានឈប់។ +${m} នាទី`);if(view==k&&tab=='time')time();
}

// ---------- EXAM COUNTDOWN ----------
function examCard(){
  const ex=ME.exam,left=ex?Math.ceil((new Date(ex.date)-new Date(today()))/864e5):0;
  return `<div class="glass p-4">
    <h3 class="font-bold text-sm mb-1"><i class="fa-solid fa-hourglass-half text-amber-400 mr-1.5"></i>រាប់ថយក្រោយថ្ងៃប្រឡង</h3>
    ${ex?`<p class="text-3xl font-extrabold text-amber-300">${left>0?`នៅសល់ ${left} ថ្ងៃទៀត`:left==0?'ថ្ងៃនេះហើយ! ស៊ូៗ 💪':'បានបញ្ចប់'}</p><p class="text-xs text-slate-400">${esc(ex.name)} · ${ex.date}</p>`:'<p class="text-xs text-slate-400">កំណត់ថ្ងៃប្រឡងសំខាន់បន្ទាប់របស់អ្នក (ឧ. ប្រឡងឆមាស, បាក់ឌុប ឬ IELTS)។</p>'}
    <div class="flex gap-2 mt-2.5"><input id="exn" class="inp" placeholder="ឈ្មោះការប្រឡង" value="${ex?esc(ex.name):''}"><input id="exd" type="date" class="inp w-auto" value="${ex?ex.date:''}"><button data-a="exam" class="btn">កំណត់</button></div>
  </div>`;
}
A.exam=()=>{const date=$('#exd').value;if(!date)return toast('សូមជ្រើសថ្ងៃប្រឡង');ME.exam={name:$('#exn').value.trim()||'ការប្រឡង',date};setDoc(doc(db,'users',U.uid),{exam:ME.exam},{merge:true}).catch(()=>{});dash()};

// ---------- QUIZ ----------
function quiz(){
  const k=view,last=sd(k).scores.slice(-3).reverse();
  $('#pane').innerHTML=`<div class="space-y-2.5 mb-3">${srcSel(k)}
    <div class="flex gap-2"><input id="qt" class="inp" placeholder="ប្រធានបទ (ឧ. លីមីត, អាស៊ីត-បាស…)"><button data-a="mk" class="btn whitespace-nowrap"><i class="fa-solid fa-wand-magic-sparkles"></i>បង្កើតសំណួរ</button></div>
    <div class="flex gap-2"><select id="qn" class="inp"><option value="5">៥ សំណួរ</option><option value="10">១០ សំណួរ</option></select><select id="ql" class="inp"><option value="easy">កម្រិតងាយ</option><option value="medium" selected>កម្រិតមធ្យម</option><option value="hard">កម្រិតពិបាក (បាក់ឌុប)</option></select></div>
  </div>
  <div id="qz"></div>
  ${last.length?`<p class="text-xs text-slate-400 mt-3">ពិន្ទុថ្មីៗ៖ ${last.map(s=>`${s.s}/${s.n} (${s.d})`).join(' · ')}</p>`:''}`;
}
A.mk=async(_,b)=>{
  const k=view,N=+$('#qn').value,LV=$('#ql').value;b.disabled=true;$('#qz').innerHTML='<p class="text-sm text-slate-400">កំពុងបង្កើតសំណួរតេស្ត…</p>';
  const ctx=await getSrc(k,$('#src').value),top=$('#qt').value.trim();
  const r=await ask([{role:'system',content:sys(k)+' Return ONLY valid JSON like {"questions":[{"q":"","options":["","","",""],"answer":0,"why":""}]} with '+N+' '+LV+' multiple-choice questions. Write math in plain unicode (x², √, Δ). '+LQ(k)+' "answer" is the index 0-3 of the correct option.'},{role:'user',content:`Make ${N} questions${top?` about: ${top}`:''}.${ctx?`\nBase them on:\n"""${ctx.slice(0,6500)}"""`:''}`}],true,false,okJ('questions'));
  b.disabled=false;let qs;try{qs=jparse(r).questions.filter(x=>x.q&&x.options?.length==4)}catch(e){}
  if(!qs?.length){if($('#qz'))$('#qz').innerHTML='<p class="text-sm text-amber-300">មិនអាចបង្កើតសំណួរបានទេ សូមព្យាយាមម្តងទៀត។</p>';return}
  Q={k,qs,i:0,s:0};showQ();
};
function showQ(){
  const z=$('#qz');if(!z)return;const q=Q.qs[Q.i];
  if(!q){const n=Q.qs.length,d=sd(Q.k);d.scores=[...d.scores,{s:Q.s,n,d:today()}].slice(-20);save(Q.k);z.innerHTML=`<div class="text-center py-5"><p class="text-4xl font-extrabold text-emerald-400">${Q.s}/${n}</p><p class="text-sm text-slate-400 mt-1">បានរក្សាទុកពិន្ទុ ✓</p></div>`;return}
  z.innerHTML=`<p class="text-xs text-slate-400 mb-1">សំណួរទី ${Q.i+1}/${Q.qs.length}</p><p class="font-semibold mb-3">${esc(q.q)}</p>`+q.options.map((o,j)=>`<button data-a="pick" data-v="${j}" class="qo w-full text-left p-3 mb-2 rounded-xl glass-soft text-sm transition">${esc(o)}</button>`).join('')+'<div id="qw"></div>';rm(z);
}
A.pick=j=>{
  if(Q.done)return;Q.done=true;const q=Q.qs[Q.i],a=+q.answer;j=+j;if(j==a)Q.s++;else{const d=sd(Q.k);(d.cards=d.cards||[]).push({f:q.q,b:q.options[a],box:1,due:today()})}
  document.querySelectorAll('.qo').forEach((e,i)=>{if(i==a)e.classList.add('!bg-emerald-600/30','!border-emerald-500');else if(i==j)e.classList.add('!bg-red-600/30','!border-red-500')});
  $('#qw').innerHTML=`<p class="text-sm text-slate-300 my-2.5 p-3 rounded-xl bg-slate-900/60">${esc(q.why||'')}</p><button data-a="nx" class="btn w-full">${Q.i+1<Q.qs.length?'សំណួរបន្ទាប់ →':'មើលលទ្ធផល'}</button>`;rm($('#qw'));
};
A.nx=()=>{Q.i++;Q.done=false;showQ()};
</script>
